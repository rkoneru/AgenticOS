framework: gdpr
title: GDPR control matrix
version: 1
scope: >-
  Maps the articles of Regulation (EU) 2016/679 that a processor or controller of an agent platform must address (principles, lawful
  basis and consent hooks, data subject rights, data protection by design, processors, records of processing, security, breach
  notification, impact assessment, transfers) to AXIS mechanisms and to evidence in this repository. AXIS is designed for and
  evidence-ready toward these obligations. It is not legal advice, and whether a deployment meets the Regulation depends on the
  operator's own role, contracts and procedures. Data subject export, erasure and restriction and retention enforcement exist as a dev-stack prototype (services/data-governance) and are proven end to end in `make e2e-phase9`; correction (Art. 16) is not built.
rows:
  - id: GDPR-Art5
    requirement: >-
      Personal data is processed lawfully, fairly and transparently, for specified purposes, minimised, accurate, kept no longer than
      needed, and protected, and the controller can demonstrate this.
    mechanism: >-
      Purpose is declared per blueprint (intended purpose and data section); memory scopes are opt-in; PHI mode redacts before
      persistence; every action is auditable and the chain can be verified to demonstrate what happened.
    code:
      [
        packages/abl/schema/abl-v1.schema.json,
        services/memory/src/redact.ts,
        services/audit/src/chain.ts,
      ]
    config: []
    evidence:
      - { kind: test, ref: services/memory/test/redact.test.ts }
      - { kind: test, ref: services/audit/test/pg.test.ts }
    status: Prototype
    notes: Accuracy is not enforced by tooling (no correction workflow); storage limitation has a retention engine with legal holds that is proven in `make e2e-phase9` but is an operator-run job, not a scheduler. Redaction is pattern based.
  - id: GDPR-Art6-7
    requirement: >-
      Processing needs a lawful basis; where consent is the basis it must be freely given, specific, demonstrable and as easy to
      withdraw as to give.
    mechanism: >-
      Consent hooks exist where a channel needs them: a voice session plays the notice before anything else, refuses to continue
      without required consent, and sends no speech to the agent before it; channel identities link only through an explicit linking step.
    code: [runtime/src/axis_runtime/voice, services/channels/src/identity.ts]
    config: []
    evidence:
      - { kind: test, ref: runtime/tests/test_voice_compliance.py }
      - { kind: test, ref: services/channels/test/identity.test.ts }
    status: Prototype
    notes: There is no consent registry, no withdrawal flow and no lawful-basis field per processing activity; the operator must supply them.
  - id: GDPR-Art12-14
    requirement: Information about the processing is given to data subjects in a concise, transparent and accessible form.
    mechanism: >-
      Blueprints at limited or high risk must carry a transparency notice that the runtime shows; the lint warns when a voice channel has
      none; the Annex IV generator records the notice in the technical documentation.
    code: [packages/abl/src/lint.ts, services/compliance/src/docgen/assemble.ts]
    config: []
    evidence:
      - { kind: test, ref: packages/abl/test/lint.test.ts }
      - { kind: test, ref: services/compliance/test/docgen.test.ts }
    status: Prototype
    notes: A privacy notice for the operator's own processing is the operator's document; nothing here generates one.
  - id: GDPR-Art15
    requirement: A data subject can obtain confirmation of processing and a copy of their personal data.
    mechanism: >-
      A privacy officer opens a request for a person; an independent owner or admin attests the requester's identity (dual control); the
      export runs every registered subject-data provider (control-plane members, channels and voice transcripts, memory, Eval Hub cases and
      results, run logs, approvals, billing references) and returns a bundle with an Ed25519 signature, per-store counts and hashes.
    code:
      [
        services/data-governance/src/dsar.ts,
        services/data-governance/src/bundle.ts,
        services/data-governance/src/verifier.ts,
        apps/api-gateway/src/adapters/governance.ts,
      ]
    config: []
    evidence:
      - { kind: test, ref: services/data-governance/test/dsar.test.ts }
      - { kind: test, ref: e2e/test_governance.py }
      - { kind: test, ref: e2e/test_phase9_hardening.py }
      - { kind: make, ref: e2e-phase9 }
    status: Prototype
    notes: Discovery is exact-match on identifiers the requester supplies (NEEDS 364); requester identity proofing is out of band and its master key a dev stand-in (NEEDS 407); the run service's in-memory run log is outside the export (NEEDS 413).
  - id: GDPR-Art16
    requirement: A data subject can have inaccurate personal data corrected.
    mechanism: None yet.
    code: []
    config: []
    evidence: []
    status: Gap
    notes: Memory entries are not editable by subject reference; no correction audit trail exists.
  - id: GDPR-Art17
    requirement: A data subject can have personal data erased where the grounds apply.
    mechanism: >-
      Erasure is idempotent and resumable per provider, then a verification pass re-queries every provider and any residual stops the request;
      the audit chain keeps hashes and pseudonymous references only (a guard refuses an event that would carry a raw identifier), the sealed
      identifiers are crypto-shredded, and a legal hold suspends the erasure until released.
    code:
      [
        services/data-governance/src/dsar.ts,
        services/data-governance/src/audit.ts,
        services/data-governance/src/holds.ts,
        services/data-governance/src/providers/memory.ts,
        services/data-governance/src/providers/channels.ts,
      ]
    config: []
    evidence:
      - { kind: test, ref: services/data-governance/test/dsar.test.ts }
      - { kind: test, ref: services/data-governance/test/kit.pg.test.ts }
      - { kind: test, ref: e2e/test_phase9_hardening.py }
      - { kind: make, ref: e2e-phase9 }
    status: Prototype
    notes: Backups are not covered (NEEDS 371); rows that must be kept for accountability are pseudonymised, not deleted (member, billing and approval rows); erasure runs inside one HTTP request (NEEDS 410).
  - id: GDPR-Art18-21
    requirement: >-
      A data subject can restrict processing, is notified of rectification or erasure, can port their data and can object to processing.
    mechanism: >-
      Restriction is recorded as a hold that processing paths consult (HoldRegistry.isRestricted); portability is the signed JSON export of
      the subject's records; notification of recipients and objection handling are not built.
    code:
      [
        services/data-governance/src/holds.ts,
        services/data-governance/src/registry.ts,
        services/data-governance/src/bundle.ts,
      ]
    config: []
    evidence:
      - { kind: test, ref: services/data-governance/test/dsar.test.ts }
      - { kind: test, ref: e2e/test_governance.py }
    status: Prototype
    notes: No service calls the restriction check on its processing path yet (NEEDS 362); the export format is a JSON bundle, not a standard portability schema; objection handling is undefined.
  - id: GDPR-Art22
    requirement: A data subject is not subject to a decision based solely on automated processing with legal or similarly significant effect, without safeguards.
    mechanism: >-
      A high-risk blueprint must require human oversight with named approver roles; the Risk Kernel returns REQUIRE_APPROVAL, the action
      waits for an approver who is not the requester, and the decision is audited.
    code:
      [
        packages/abl/schema/abl-v1.schema.json,
        services/approvals/src/service.ts,
        services/risk-kernel/src/approvals.ts,
      ]
    config: []
    evidence:
      - { kind: test, ref: services/approvals/test/service.test.ts }
      - { kind: make, ref: e2e-phase3 }
    status: Built
    notes: Whether a given use is solely automated is a judgement for the operator; the platform enforces the oversight a blueprint declares, nothing more.
  - id: GDPR-Art25
    requirement: Data protection is built into the design and defaults of processing.
    mechanism: >-
      Default deny in the Risk Kernel, tenant isolation in the database, PHI redaction before persistence, memory scopes off unless
      declared, and secrets kept out of blueprints and logs.
    code:
      [
        services/risk-kernel/src/kernel.ts,
        packages/db/migrations/0001_tenancy_and_rls.sql,
        services/memory/src/acl.ts,
      ]
    config: [policies/baseline-deny/pack.yaml]
    evidence:
      - { kind: test, ref: packages/db/test/tenancy.test.ts }
      - { kind: test, ref: services/memory/test/isolation.test.ts }
      - { kind: make, ref: e2e-phase4 }
    status: Built
    notes: Covers the platform's own defaults; the operator's blueprints and policy packs still decide what an agent may do with personal data.
  - id: GDPR-Art28
    requirement: A processor acts only on documented instructions and is bound by a contract that covers security, sub-processors, assistance and deletion.
    mechanism: >-
      Technical enablers only: tenant isolation, bring-your-own model keys, a single model gateway and an audit chain that records
      gated actions. The contract itself is not a repository artifact.
    code: [services/control-plane/src/modelkeys.ts, runtime/src/axis_runtime/models]
    config: []
    evidence:
      - { kind: test, ref: services/control-plane/test/modelkeys.test.ts }
    status: Designed
    notes: No data processing agreement template, sub-processor list or customer instruction log exists; no live provider has been called.
  - id: GDPR-Art30
    requirement: Records of processing activities are maintained and available to the supervisory authority.
    mechanism: >-
      The AI system inventory records purpose, owner, risk level, data categories and stakeholders per system and version; blueprints
      declare data and residency; the audit chain records what ran.
    code: [services/compliance/src/records/inventory.ts, packages/db/migrations/0014_compliance.sql]
    config: []
    evidence:
      - { kind: test, ref: services/compliance/test/records.test.ts }
      - { kind: test, ref: services/compliance/test/stores.test.ts }
    status: Prototype
    notes: >-
      The inventory is a record per AI system, not a full Article 30 register (no recipients, transfers or retention periods per
      activity); it is exposed read-only in the console.
  - id: GDPR-Art32
    requirement: Technical and organisational measures give a level of security appropriate to the risk.
    mechanism: >-
      Pseudonymisation and redaction before persistence, sealed storage of tenant keys, access control, an append-only verified audit chain,
      tenant isolation, resilience through fail-closed design, and regular testing through the end-to-end suites.
    code:
      [
        services/control-plane/src/crypto.ts,
        services/audit/src/checkpoint.ts,
        packages/db/migrations/0001_tenancy_and_rls.sql,
      ]
    config: []
    evidence:
      - { kind: test, ref: services/control-plane/test/crypto.test.ts }
      - { kind: test, ref: services/audit/test/checkpoint.test.ts }
      - { kind: make, ref: e2e-phase6 }
    status: Prototype
    notes: No encryption at rest is configured by the repository, key management uses a fake KMS, and there is no tested restore or penetration test.
  - id: GDPR-Art33-34
    requirement: >-
      A personal data breach is notified to the supervisory authority within 72 hours and, where risk is high, to the data subjects.
    mechanism: >-
      The audit chain and its verification support establishing what was accessed and when; the runbooks describe how to read and verify
      it. There is no breach workflow.
    code: [services/audit/src/export.ts]
    config: []
    evidence:
      - { kind: doc, ref: docs/runbooks/audit.md }
    status: Designed
    notes: No breach register, notification templates, severity assessment or clock tracking exists.
  - id: GDPR-Art35
    requirement: A data protection impact assessment is made before processing that is likely to result in a high risk.
    mechanism: >-
      AI impact assessment records link a system and its blueprint versions to affected groups, risks, mitigations and a review date, with
      an independent reviewer and overdue detection.
    code:
      [services/compliance/src/records/assessments.ts, services/compliance/src/records/states.ts]
    config: []
    evidence:
      - { kind: make, ref: e2e-compliance }
      - { kind: test, ref: services/compliance/test/records.test.ts }
      - { kind: test, ref: services/compliance/test/properties.test.ts }
    status: Prototype
    notes: The record is an AI impact assessment, not a templated DPIA; prior consultation with the authority and DPO advice are not modelled.
  - id: GDPR-Art44-49
    requirement: Personal data is transferred outside the EEA only under an adequacy decision, safeguards or a listed derogation.
    mechanism: >-
      Blueprints declare a data residency, PHI blueprints must declare one (lint ABL005), and tenants have a home region. Enforcement of
      the region on write paths and in model provider selection is planned in Phase 9.
    code: [packages/abl/src/lint.ts, packages/db/migrations/0001_tenancy_and_rls.sql]
    config: []
    evidence:
      - { kind: test, ref: packages/abl/test/lint.test.ts }
    status: Designed
    notes: Residency is declared but not enforced, no transfer mechanism (SCCs) is recorded, and no regional deployment exists.

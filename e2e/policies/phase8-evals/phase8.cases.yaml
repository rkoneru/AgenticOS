packs: [../../../policies/baseline-deny/pack.yaml, pack.yaml]
cases:
  - name: the blueprint's model call is allowed
    input: { enforcement_point: model_call, agent: { name: answer-agent, version: 1.0.0 } }
    expect: { decision: ALLOW, winners: [tenant-evals/allow-agent-model-calls] }
  - name: the eval judge's model call is allowed by the explicit rule
    input: { enforcement_point: model_call, agent: { name: eval-judge, version: judge-v1 } }
    expect: { decision: ALLOW, winners: [tenant-evals/allow-eval-judge-model-calls] }
  - name: an unknown agent's model call is denied
    input: { enforcement_point: model_call, agent: { name: stranger, version: 1.0.0 } }
    expect: { decision: DENY }
  - name: a payout needs a human
    input:
      { enforcement_point: tool_call, tool: { name: file-payout, side_effects: write }, args: {} }
    expect: { decision: REQUIRE_APPROVAL, winners: [tenant-evals/approve-payouts] }
  - name: a wire transfer is forbidden
    input:
      { enforcement_point: tool_call, tool: { name: wire-funds, side_effects: write }, args: {} }
    expect: { decision: DENY, winners: [tenant-evals/deny-wire-funds] }

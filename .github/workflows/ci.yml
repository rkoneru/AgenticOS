name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: open-policy-agent/setup-opa@v2
        with: { version: 0.70.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm cov
      - run: make contracts-lint
      - run: make policy-test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy runtime/src sdk/python/src
      - run: uv run pytest runtime sdk/python

  e2e-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v3
      - uses: open-policy-agent/setup-opa@v2
        with: { version: 0.70.0 }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      - run: pnpm build
      - run: uv run pytest e2e/test_phase2_core_loop.py -p no:cacheprovider --no-cov

  e2e-phase3:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v3
      - uses: open-policy-agent/setup-opa@v2
        with: { version: 0.70.0 }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      - run: pnpm build
      - run: uv run pytest e2e/test_phase3_orchestration.py -p no:cacheprovider --no-cov
      - run: uv run pytest runtime/tests/test_bypass.py runtime/tests/test_audit_hook.py -q -p no:cacheprovider --no-cov

  e2e-phase4:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v3
      - uses: open-policy-agent/setup-opa@v2
        with: { version: 0.70.0 }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      - run: pnpm build
      - run: uv run playwright install --with-deps chromium
      # the sandbox needs unprivileged user namespaces (Ubuntu 24.04 runners restrict them via AppArmor); unrun remotely
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv run pytest e2e/test_phase4_tools.py -p no:cacheprovider --no-cov
      - run: uv run pytest runtime/tests/test_bypass.py runtime/tests/test_audit_hook.py runtime/tests/test_mcp_bypass.py -q -p no:cacheprovider --no-cov

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env.example config -q

  sast:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "javascript-typescript,python" }
      - uses: github/codeql-action/analyze@v3

  secrets-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with: { format: cyclonedx-json, output-file: sbom.cdx.json }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }

  freeze-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Frozen contracts may only change together with an ADR
        run: |
          base=origin/${{ github.base_ref }}
          if git diff --name-only "$base"...HEAD | grep -q '^packages/contracts/FREEZE.json$'; then
            git diff --name-only --diff-filter=AM "$base"...HEAD | grep -q '^docs/adr/' \
              || { echo "FREEZE.json changed without a new or updated ADR under docs/adr/"; exit 1; }
          fi

  # Container scanning activates in Phase 10 when service images exist.

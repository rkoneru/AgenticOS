      responses:
        "200":
          description: Graded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalReviewTask" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/reviews/tasks/{taskId}/skip:
    post:
      tags: [Evals]
      operationId: skipEvalReviewTask
      summary: Give a claimed task back; you will not be offered it again
      parameters: [{ $ref: "#/components/parameters/EvalTaskId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:

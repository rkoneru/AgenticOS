      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistryKey" } }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Registry]
      operationId: addRegistryKey
      summary: Register an Ed25519 publisher public key for a namespace (admin)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/IdempotencyKey" }

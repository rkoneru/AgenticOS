openapi: 3.1.0
info:
  title: AXIS Control Plane API
  version: 1.4.0
  summary: Governed agent runtime — REST API v1
  description: |
    Source of truth for the public `/v1` API. SDKs and server route schemas are generated from this file.

    **Conventions**
    - Every request is scoped to one tenant, derived from the credential; there is no `tenant_id` parameter.
    - `POST` endpoints that create or start something accept an `Idempotency-Key` header.
    - Lists are cursor-paginated (`limit`, `cursor`) and return `next_cursor`.
    - Errors use `application/problem+json` (RFC 9457).
    - A request that cannot be evaluated by the policy gate is denied, never allowed (`403`, code `policy_denied`).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.{region}.axis.example/v1
    variables:
      region: { default: us-east-1, description: Region-pinned deployment }
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - { name: Blueprints, description: Versioned ABL agent blueprints }
  - { name: Runs, description: Agent runs and their process lifecycle }
  - { name: Approvals, description: Human-in-the-loop approval queue }
  - { name: Policies, description: Policy packs compiled to Rego }
  - { name: Audit, description: Tamper-evident audit log }
  - { name: Kill switches, description: Emergency stops by scope }
  - { name: Usage, description: Metered usage }
  - {
      name: Evals,
      description: "Eval Hub: datasets, suites, runs, baselines, the release gate, human review, online sampling",
    }
  - { name: Explanations, description: Read-only AGIL explanations of runs and audited decisions }
  - { name: Identity, description: Who the credential belongs to }
  - {
      name: Registry,
      description: "Signed, provenance-attested blueprint registry (private namespaces per tenant)",
    }
  - { name: Marketplace, description: Security-reviewed listings and consented installs }
paths:
  /blueprints:
    get:
      tags: [Blueprints]
      operationId: listBlueprints
      summary: List blueprints
      parameters:
        [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Page of blueprints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Blueprints]
      operationId: publishBlueprintVersion
      summary: Validate and publish a blueprint version (immutable once published)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abl]
              additionalProperties: false
              properties:
                abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintVersion" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /blueprints/{name}/versions/{version}:
    get:
      tags: [Blueprints]
      operationId: getBlueprintVersion
      summary: Get one blueprint version
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Blueprint version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintVersion" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ProcessState" } }
        - { name: blueprint, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Runs]
      operationId: startRun
      summary: Start a run (spawns the init process as a durable workflow)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              additionalProperties: false
              properties:
                blueprint:
                  type: object
                  required: [name, version]
                  properties:
                    name: { type: string }
                    version: { type: string }
                input: { type: object }
      responses:
        "202":
          description: Accepted; the run is starting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get a run
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{runId}/signals:
    post:
      tags: [Runs]
      operationId: signalRun
      summary: Send a signal (PAUSE, RESUME, TERM, KILL, INTERRUPT) to a process in the run
      parameters:
        [
          { $ref: "#/components/parameters/RunId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              additionalProperties: false
              properties:
                pid:
                  {
                    $ref: "#/components/schemas/Pid",
                    description: Defaults to the run's init process,
                  }
                signal: { $ref: "#/components/schemas/Signal" }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Signal delivered; resulting state
          content:
            application/json:
              schema:
                type: object
                required: [pid, state]
                properties:
                  pid: { $ref: "#/components/schemas/Pid" }
                  state: { $ref: "#/components/schemas/ProcessState" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{runId}/events:
    get:
      tags: [Runs]
      operationId: listRunEvents
      summary: Read the run's append-only event log (basis for replay)
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: after_sequence, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Events in sequence order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }
                  next_cursor: { type: [string, "null"] }
            text/event-stream:
              schema:
                {
                  type: string,
                  description: Server-sent RunEvent objects when Accept is text/event-stream,
                }
        default: { $ref: "#/components/responses/Problem" }
  /approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List approvals
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApprovalStatus" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Page of approvals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalPage" }
        default: { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: Approve or reject a pending approval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { enum: [approve, reject] }
                comment: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /policies:
    get:
      tags: [Policies]
      operationId: listPolicyPacks
      summary: List policy packs
      parameters:
        [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Page of policy packs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPackPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Policies]
      operationId: publishPolicyPack
      summary: Validate, compile to Rego and publish a policy pack version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              additionalProperties: false
              properties:
                policy: { $ref: "../schemas/policy-v1.schema.json" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPack" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /policies:test:
    post:
      tags: [Policies]
      operationId: testPolicy
      summary: Evaluate a hypothetical request against a policy pack without executing anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy, request]
              additionalProperties: false
              properties:
                policy: { $ref: "../schemas/policy-v1.schema.json" }
                request:
                  type: object
                  required: [enforcement_point, context]
                  properties:
                    enforcement_point: { type: string }
                    action: { type: string }
                    context: { type: object }
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateDecision" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Query the tenant's audit log
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: trace_id, in: query, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
        - { name: decision, in: query, schema: { $ref: "#/components/schemas/Decision" } }
        - { name: from_seq, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Page of audit events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "../schemas/audit-event-v1.schema.json" } }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{runId}/explanation:
    get:
      tags: [Explanations]
      operationId: explainRun
      summary: Explain a run from its audit trail (AGIL; read-only, deterministic)
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Structured explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explanation" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/events/{seq}/explanation:
    get:
      tags: [Explanations]
      operationId: explainAuditEvent
      summary: Explain one audited decision or approval step (AGIL; read-only, deterministic)
      parameters:
        - { name: seq, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Structured explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explanation" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/verify:
    post:
      tags: [Audit]
      operationId: verifyAuditChain
      summary: Verify hash-chain integrity over a range
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from_seq: { type: integer, minimum: 1 }
                to_seq: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Verdict
          content:
            application/json:
              schema:
                type: object
                required: [ok, verified]
                properties:
                  ok: { type: boolean }
                  verified: { type: integer }
                  broken_at_seq: { type: integer }
                  reason: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /kill-switches:
    get:
      tags: [Kill switches]
      operationId: listKillSwitches
      summary: List engaged kill-switches visible to the tenant
      responses:
        "200":
          description: Kill switches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KillSwitch" } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Kill switches]
      operationId: setKillSwitch
      summary: Engage or release a tenant, agent or tool kill-switch (effective < 1 s)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillSwitchRequest" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillSwitch" }
        default: { $ref: "#/components/responses/Problem" }
  /usage:
    get:
      tags: [Usage]
      operationId: getUsage
      summary: Metered usage by meter and period
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: group_by, in: query, schema: { enum: [meter, model, blueprint, day] } }
      responses:
        "200":
          description: Usage rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [meter, quantity, unit]
                      properties:
                        meter: { $ref: "#/components/schemas/Meter" }
                        quantity: { type: number }
                        unit: { type: string }
                        group: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /evals/runs:
    get:
      tags: [Evals]
      operationId: listEvalRuns
      summary: List eval runs, newest first (without per-case results)
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: suite, in: query, schema: { type: string, maxLength: 130 } }
        - {
            name: blueprint,
            in: query,
            description: Blueprint name,
            schema: { type: string, maxLength: 63 },
          }
        - { name: content_hash, in: query, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: status, in: query, schema: { enum: [queued, running, passed, failed, errored] } }
      responses:
        "200":
          description: Page of runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRunPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Evals]
      operationId: startEvalRun
      summary: Queue an eval run of a suite against a blueprint version (a registered runner picks it up)
      description: |
        The blueprint is resolved to its content hash (a tenant blueprint, or `namespace/name@version` from the registry) and the run is
        bound to that exact content. The run is executed by a registered eval runner through the real, kernel-gated run path; its scores
        are recomputed by the hub from the per-case results and never taken from the runner's aggregate.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suite, blueprint]
              additionalProperties: false
              properties:
                suite: { type: string }
                mode: { enum: [ci, manual] }
                blueprint:
                  type: object
                  required: [name, version]
                  properties:
                    name: { type: string }
                    version: { type: string }
                    namespace: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRun" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/runs/{evalRunId}:
    get:
      tags: [Evals]
      operationId: getEvalRun
      summary: Get one eval run with its per-case results, scores and provenance
      parameters: [{ $ref: "#/components/parameters/EvalRunId" }]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRunDetail" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/runs/{evalRunId}/comparison:
    get:
      tags: [Evals]
      operationId: getEvalRunComparison
      summary: Compare a finished run with the current baseline of its blueprint and suite (delta, regression, paired significance)
      parameters: [{ $ref: "#/components/parameters/EvalRunId" }]
      responses:
        "200":
          description: The comparison; `comparison` is absent when the blueprint has no baseline for the suite
          content:
            application/json:
              schema:
                type: object
                properties:
                  comparison: { $ref: "#/components/schemas/EvalComparison" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/gate:
    post:
      tags: [Evals]
      operationId: gateEvalRelease
      summary: Ask the release gate whether a blueprint version may be released (fail-closed; the decision is audited)
      description: |
        Allowed only when, for every required suite, the latest finished run of the blueprint's CONTENT HASH by a registered runner is
        fresh, covers the dataset, re-verifies, scores at least max(declared threshold, suite pass threshold) and shows no regression
        beyond the suite's tolerance against the baseline. Anything missing, stale, failed or unverifiable blocks and is listed in `reasons`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              additionalProperties: false
              properties:
                blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
                suites:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [ref]
                    additionalProperties: false
                    properties:
                      ref:
                        {
                          type: string,
                          maxLength: 130,
                          description: "[namespace/]name@version or semver range",
                        }
                      threshold: { type: number, minimum: 0, maximum: 1 }
      responses:
        "200":
          description: The decision (allowed true or false)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalGateResult" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/datasets:
    get:
      tags: [Evals]
      operationId: listEvalDatasets
      summary: List dataset versions (without their cases)
      parameters: [{ name: name, in: query, schema: { type: string, maxLength: 63 } }]
      responses:
        "200":
          description: Dataset versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalDataset" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Evals]
      operationId: createEvalDataset
      summary: Create the next immutable version of a dataset (PHI datasets are redacted before they are stored)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cases]
              additionalProperties: false
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
                description: { type: string, maxLength: 2000 }
                phi:
                  {
                    type: boolean,
                    description: Redact personal data before persisting; a dataset that was PHI stays PHI,
                  }
                cases:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 5000,
                    items: { $ref: "#/components/schemas/EvalCase" },
                  }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalDataset" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/datasets/{name}/versions/{version}:
    get:
      tags: [Evals]
      operationId: getEvalDatasetVersion
      summary: Get one dataset version with its cases (`version` is an integer or `latest`)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The dataset version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalDatasetVersion" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/suites:
    get:
      tags: [Evals]
      operationId: listEvalSuites
      summary: List eval suites
      responses:
        "200":
          description: Suites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalSuite" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Evals]
      operationId: createEvalSuite
      summary: Create an immutable eval suite (a changed definition is a new version)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref, dataset_ref, graders, pass_threshold]
              additionalProperties: false
              properties:
                ref: { type: string, description: "[namespace/]name@major.minor.patch" }
                dataset_ref: { type: string, description: "name@<integer version>" }
                graders:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 20,
                    items: { $ref: "#/components/schemas/EvalGrader" },
                  }
                pass_threshold: { type: number, minimum: 0, maximum: 1 }
                min_case_score: { type: [number, "null"], minimum: 0, maximum: 1 }
                settings: { type: object }
                tolerance: { type: number, minimum: 0, maximum: 1 }
                required_for_release: { type: boolean }
                applies_to: { type: array, maxItems: 50, items: { type: string } }
                min_samples: { type: integer, minimum: 1 }
                max_age_days: { type: integer, minimum: 1, maximum: 365 }
                regression_requires_significance: { type: boolean }
                alpha:
                  {
                    type: number,
                    description: "Significance level of the paired test, 0.0001 to 0.5 (default 0.05)",
                  }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalSuite" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/suites/{suite}:
    get:
      tags: [Evals]
      operationId: getEvalSuite
      summary: Get one suite by its reference (`name@version`, URL-encoded)
      parameters: [{ name: suite, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The suite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalSuite" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/baselines:
    get:
      tags: [Evals]
      operationId: listEvalBaselines
      summary: The baseline history of a blueprint name for a suite (current = highest seq)
      parameters:
        - { name: blueprint, in: query, required: true, schema: { type: string, maxLength: 63 } }
        - { name: suite, in: query, required: true, schema: { type: string, maxLength: 130 } }
      responses:
        "200":
          description: Baselines, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalBaseline" } }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Evals]
      operationId: setEvalBaseline
      summary: Make a finished, passed, intact run the baseline for its blueprint name and suite (admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id]
              additionalProperties: false
              properties:
                run_id: { type: string, format: uuid }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalBaseline" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/reviews/tasks:
    get:
      tags: [Evals]
      operationId: listEvalReviewTasks
      summary: Human-review tasks you may work on (never the ones for blueprints you published or runs you started)
      parameters:
        - {
            name: state,
            in: query,
            schema: { enum: [open, claimed, needs_adjudication, resolved] },
          }
        - { name: run_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Tasks, earliest SLA deadline first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalReviewTask" } }
        default: { $ref: "#/components/responses/Problem" }
  /evals/reviews/tasks/{taskId}/claim:
    post:
      tags: [Evals]
      operationId: claimEvalReviewTask
      summary: Claim a human-review task (the claim expires; the publisher and the starter are refused)
      parameters: [{ $ref: "#/components/parameters/EvalTaskId" }]
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalReviewTask" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/reviews/tasks/{taskId}/grade:
    post:
      tags: [Evals]
      operationId: gradeEvalReviewTask
      summary: Grade a claimed task (double-graded tasks need two different reviewers, a disagreement a third)
      parameters: [{ $ref: "#/components/parameters/EvalTaskId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score, comment]
              additionalProperties: false
              properties:
                score: { type: number, minimum: 0, maximum: 1 }
                comment: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Graded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalReviewTask" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/reviews/tasks/{taskId}/skip:
    post:
      tags: [Evals]
      operationId: skipEvalReviewTask
      summary: Give a claimed task back; you will not be offered it again
      parameters: [{ $ref: "#/components/parameters/EvalTaskId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalReviewTask" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/sampling:
    get:
      tags: [Evals]
      operationId: listEvalSamplingConfigs
      summary: Online sampling configurations (sampled production runs are graded asynchronously; results never gate a release)
      responses:
        "200":
          description: Configurations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalSamplingConfig" } }
        default: { $ref: "#/components/responses/Problem" }
  /evals/sampling/{samplingId}:
    put:
      tags: [Evals]
      operationId: putEvalSamplingConfig
      summary: Create or replace an online sampling configuration (admin)
      parameters: [{ $ref: "#/components/parameters/EvalSamplingId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, suite, rate, max_per_hour]
              additionalProperties: false
              properties:
                blueprint: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
                suite: { type: string }
                rate: { type: number, minimum: 0, maximum: 1 }
                max_per_hour: { type: integer, minimum: 1, maximum: 100000 }
                redaction: { enum: [phi, always] }
                enabled: { type: boolean }
                alert_threshold: { type: [number, "null"], minimum: 0, maximum: 1 }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalSamplingConfig" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/online/summary:
    get:
      tags: [Evals]
      operationId: getEvalOnlineSummary
      summary: History and alert state of the online samples (informational only)
      parameters:
        - { name: blueprint, in: query, schema: { type: string, maxLength: 63 } }
        - { name: suite, in: query, schema: { type: string, maxLength: 130 } }
      responses:
        "200":
          description: Summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalOnlineSummary" } }
        default: { $ref: "#/components/responses/Problem" }
  /evals/runners:
    get:
      tags: [Evals]
      operationId: listEvalRunners
      summary: Registered eval runners (admin)
      responses:
        "200":
          description: Runners
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalRunner" } }
        default: { $ref: "#/components/responses/Problem" }
  /evals/runners/{runnerId}:
    put:
      tags: [Evals]
      operationId: registerEvalRunner
      summary: Register an eval runner id for the tenant (admin). Only runs of registered runners count toward a release gate.
      parameters: [{ $ref: "#/components/parameters/EvalRunnerId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRunner" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /evals/runners/{runnerId}/revoke:
    post:
      tags: [Evals]
      operationId: revokeEvalRunner
      summary: Revoke a runner (admin; one-way). Its earlier runs stop counting toward release gates.
      parameters: [{ $ref: "#/components/parameters/EvalRunnerId" }]
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRunner" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Who the credential belongs to (tenant, member, role, credential kind and scopes)
      description: Needs a valid credential only; no scope is required, so a narrowly scoped API key can still identify itself.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        default: { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}:
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Get one approval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /policies/{versionId}/activate:
    post:
      tags: [Policies]
      operationId: activatePolicyPack
      summary: Make a published policy pack version the tenant's active version of that pack (the Risk Kernel enforces it from then on)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPack" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/namespaces:
    get:
      tags: [Registry]
      operationId: listRegistryNamespaces
      summary: List the registry namespaces your tenant owns
      responses:
        "200":
          description: Namespaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistryNamespace" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Registry]
      operationId: claimRegistryNamespace
      summary: Claim a registry namespace for your tenant (admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace]
              additionalProperties: false
              properties:
                namespace: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
      responses:
        "201":
          description: Claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryNamespace" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/namespaces/{namespace}/keys:
    get:
      tags: [Registry]
      operationId: listRegistryKeys
      summary: List a namespace's publisher keys (public halves only)
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistryKey" } }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Registry]
      operationId: addRegistryKey
      summary: Register an Ed25519 publisher public key for a namespace (admin)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              additionalProperties: false
              properties:
                public_key:
                  { type: string, description: base64url of the raw 32-byte Ed25519 public key }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryKey" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/namespaces/{namespace}/blueprints:
    post:
      tags: [Registry]
      operationId: publishRegistryBlueprint
      summary: Publish a signed blueprint version with its provenance attestation (immutable; verified before it is stored)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abl, signature, provenance]
              additionalProperties: false
              properties:
                abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
                signature: { $ref: "#/components/schemas/RegistrySignature" }
                provenance: { $ref: "#/components/schemas/DsseEnvelope" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryVersion" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/blueprints/{namespace}/{name}/versions:
    get:
      tags: [Registry]
      operationId: listRegistryVersions
      summary: List the versions of a registry blueprint with their status
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistryVersion" } }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/blueprints/{namespace}/{name}/versions/{version}/eval-attestations:
    get:
      tags: [Registry]
      operationId: listRegistryEvalAttestations
      summary: Signed eval-result attestations attached to a version (its eval history, as the Eval Hub vouches for it)
      description: |
        Every finished eval run of this exact content is attested by the Eval Hub and attached append-only. Each envelope is
        re-verified against the trusted hub keys on every read (`verified`); a summary (`predicate`) is shown only when it verifies.
        Same visibility as the version itself (the owner, or everyone once the version is released).
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Attestations, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RegistryEvalAttestation" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/blueprints/{namespace}/{name}/versions/{version}/yank:
    post:
      tags: [Registry]
      operationId: yankRegistryVersion
      summary: Yank a version so it stops resolving (admin; recorded, never deleted)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Yanked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/resolve:
    get:
      tags: [Registry]
      operationId: resolveRegistryBlueprint
      summary: Resolve `namespace/name@range` to the highest non-yanked version and VERIFY it (hash, signature, provenance) before returning it
      parameters:
        - { name: ref, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The verified blueprint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedBlueprint" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/listings:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceListings
      summary: Browse the marketplace catalog (listed, security-reviewed blueprints only)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, maxLength: 50 } }
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MarketplaceListing" } }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/listings/{namespace}/{name}:
    get:
      tags: [Marketplace]
      operationId: getMarketplaceListing
      summary: Get one marketplace listing
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceListing" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/installs/preview:
    post:
      tags: [Marketplace]
      operationId: previewMarketplaceInstall
      summary: Preview an install - findings, requested permissions, the diff against your tenant baseline and the consent digest (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, name, range]
              additionalProperties: false
              properties:
                namespace: { type: string }
                name: { type: string }
                range: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallPreview" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/installs:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceInstalls
      summary: List your tenant's installs
      responses:
        "200":
          description: Installs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MarketplaceInstall" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Marketplace]
      operationId: installMarketplaceListing
      summary: Install a listing, pinned to a version and content hash, with consent to the exact permission diff you previewed (admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, name, version, content_hash, consent_digest]
              additionalProperties: false
              properties:
                namespace: { type: string }
                name: { type: string }
                version: { type: string }
                content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                consent_digest: { type: string }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceInstall" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/installs/{namespace}/{name}/uninstall:
    post:
      tags: [Marketplace]
      operationId: uninstallMarketplaceListing
      summary: Uninstall a listing (admin)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Uninstalled
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      {
        type: http,
        scheme: bearer,
        bearerFormat: JWT,
        description: Short-lived token issued via WorkOS SSO,
      }
    apiKey: { type: apiKey, in: header, name: X-Axis-Api-Key }
  parameters:
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    Namespace:
      {
        name: namespace,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" },
      }
    EvalRunId: { name: evalRunId, in: path, required: true, schema: { type: string, format: uuid } }
    EvalTaskId: { name: taskId, in: path, required: true, schema: { type: string, maxLength: 100 } }
    EvalSamplingId:
      {
        name: samplingId,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$" },
      }
    EvalRunnerId:
      {
        name: runnerId,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$" },
      }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key; replays within 24 h return the original response.
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationProblem:
      description: The document failed schema or lint validation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblemBody" }
  schemas:
    Pid: { type: string, pattern: "^axp_[0-9A-HJKMNP-TV-Z]{26}$" }
    ProcessState: { enum: [spawn, ready, running, waiting, suspended, terminated] }
    Signal: { enum: [PAUSE, RESUME, TERM, KILL, INTERRUPT] }
    Decision: { enum: [ALLOW, DENY, REQUIRE_APPROVAL, ALLOW_WITH_REDACTION] }
    ApprovalStatus: { enum: [pending, approved, rejected, expired, escalated] }
    Meter:
      {
        enum:
          [
            tokens,
            runtime_seconds,
            tool_executions,
            voice_minutes,
            storage_gb_hours,
            marketplace_installs,
          ],
      }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: "URI, e.g. https://axis.example/problems/policy_denied" }
        title: { type: string }
        status: { type: integer }
        code:
          {
            enum:
              [
                unauthenticated,
                forbidden,
                policy_denied,
                not_found,
                conflict,
                validation_failed,
                rate_limited,
                budget_exceeded,
                internal,
              ],
          }
        detail: { type: string }
        trace_id: { type: string }
    ValidationProblemBody:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  { path: { type: string }, keyword: { type: string }, message: { type: string } }
    BlueprintVersion:
      type: object
      required: [name, version, risk_level, created_at, abl]
      properties:
        name: { type: string }
        version: { type: string }
        risk_level: { enum: [minimal, limited, high] }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        signature: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
    BlueprintPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BlueprintVersion" } }
        next_cursor: { type: [string, "null"] }
    Run:
      type: object
      required: [id, blueprint, state, created_at]
      properties:
        id: { type: string, format: uuid }
        init_pid: { $ref: "#/components/schemas/Pid" }
        blueprint:
          type: object
          required: [name, version]
          properties: { name: { type: string }, version: { type: string } }
        state: { $ref: "#/components/schemas/ProcessState" }
        exit_reason: { type: [string, "null"] }
        trace_id: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    RunPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
        next_cursor: { type: [string, "null"] }
    RunEvent:
      type: object
      required: [sequence, type, pid, at]
      properties:
        sequence: { type: integer, minimum: 1 }
        type:
          {
            type: string,
            description: "state_transition, model_call, tool_call, gate_decision, message, ...",
          }
        pid: { $ref: "#/components/schemas/Pid" }
        at: { type: string, format: date-time }
        audit_event_id: { type: string, format: uuid }
        data: { type: object }
    GateDecision:
      type: object
      required: [decision, policy_version]
      properties:
        decision: { $ref: "#/components/schemas/Decision" }
        policy_version: { type: string }
        reason: { type: string }
        matched_rule_ids: { type: array, items: { type: string } }
        redact_fields: { type: array, items: { type: string } }
    Approval:
      type: object
      required: [id, status, run_id, requested_at, sla_deadline]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        run_id: { type: string, format: uuid }
        pid: { $ref: "#/components/schemas/Pid" }
        action: { type: string }
        roles: { type: array, items: { type: string } }
        requested_at: { type: string, format: date-time }
        sla_deadline: { type: string, format: date-time }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        comment: { type: [string, "null"] }
    ApprovalPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        next_cursor: { type: [string, "null"] }
    PolicyPack:
      type: object
      required: [name, version, created_at]
      properties:
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        created_at: { type: string, format: date-time }
        version_id: { type: string, format: uuid, description: Id to pass to activatePolicyPack }
        active:
          {
            type: boolean,
            description: Whether this version is the tenant's active version of the pack,
          }
    PolicyPackPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PolicyPack" } }
        next_cursor: { type: [string, "null"] }
    KillSwitchRequest:
      type: object
      required: [scope, engaged]
      additionalProperties: false
      properties:
        scope: { enum: [tenant, agent, tool] }
        target: { type: string, description: Required for agent and tool scopes }
        engaged: { type: boolean }
        reason: { type: string, maxLength: 500 }
    KillSwitch:
      type: object
      required: [scope, engaged, updated_at]
      properties:
        scope: { enum: [global, tenant, agent, tool] }
        target: { type: [string, "null"] }
        engaged: { type: boolean }
        reason: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
    EvalRun:
      type: object
      required: [id, suite, status]
      properties:
        id: { type: string, format: uuid }
        suite: { type: string }
        status: { enum: [queued, running, passed, failed, errored] }
        score: { type: [number, "null"] }
        threshold: { type: [number, "null"] }
        blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
        mode: { enum: [ci, manual] }
        scores: { $ref: "#/components/schemas/EvalScores" }
        sample_size: { type: integer }
        pending_human: { type: integer }
        cost:
          type: object
          properties:
            agent_usd: { type: string }
            judge_usd: { type: string }
            total_usd: { type: string }
            tokens: { type: integer }
            judge_tokens: { type: integer }
        runner_id: { type: [string, "null"] }
        requested_by: { type: string }
        provenance: { type: [object, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        failure_reason: { type: [string, "null"] }
        record_hash: { type: [string, "null"] }
    EvalBlueprintRef:
      type: object
      required: [name, version, content_hash]
      additionalProperties: false
      properties:
        namespace: { type: [string, "null"] }
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        version: { type: string, minLength: 1, maxLength: 64 }
        content_hash:
          {
            type: string,
            pattern: "^[0-9a-f]{64}$",
            description: SHA-256 of the canonical ABL; a run counts only for exactly this content,
          }
    EvalScores:
      type: object
      required: [status, overall, per_grader, per_case, passed, failures, ungraded]
      properties:
        status: { enum: [complete, pending_human] }
        overall: { type: [number, "null"], minimum: 0, maximum: 1 }
        per_grader: { type: object, additionalProperties: { type: number } }
        per_case: { type: object, additionalProperties: { type: number } }
        passed: { type: [boolean, "null"] }
        failures: { type: array, items: { type: string } }
        ungraded: { type: integer }
    EvalCaseResult:
      type: object
      required: [case_id, status, grades]
      properties:
        case_id: { type: string }
        status: { type: string }
        attempts: { type: integer }
        seed: { type: integer }
        error: { type: [string, "null"] }
        score: { type: [number, "null"] }
        output: { type: [string, "null"] }
        grades:
          type: array
          items:
            type: object
            required: [grader_id, kind, status, score]
            properties:
              grader_id: { type: string }
              kind: { enum: [deterministic, model, human] }
              status: { enum: [scored, ungraded, pending, error] }
              score: { type: number }
              detail: { type: string }
              provenance: { type: object }
        trace: { type: [object, "null"] }
    EvalRunDetail:
      type: object
      required: [id, suite, status, case_results]
      properties:
        id: { type: string, format: uuid }
        suite: { type: string }
        status: { enum: [queued, running, passed, failed, errored] }
        score: { type: [number, "null"] }
        threshold: { type: [number, "null"] }
        blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
        mode: { enum: [ci, manual] }
        scores: { $ref: "#/components/schemas/EvalScores" }
        sample_size: { type: integer }
        pending_human: { type: integer }
        cost:
          type: object
          properties:
            agent_usd: { type: string }
            judge_usd: { type: string }
            total_usd: { type: string }
            tokens: { type: integer }
            judge_tokens: { type: integer }
        runner_id: { type: [string, "null"] }
        requested_by: { type: string }
        provenance: { type: [object, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        failure_reason: { type: [string, "null"] }
        record_hash: { type: [string, "null"] }
        case_results: { type: array, items: { $ref: "#/components/schemas/EvalCaseResult" } }
    EvalRunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EvalRun" } }
        next_cursor: { type: [string, "null"] }
    EvalGateResult:
      type: object
      required: [allowed, blueprint, reasons, runs, checked_at]
      properties:
        allowed: { type: boolean }
        blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
        reasons:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                description: "missing_run, no_run_for_content_hash, runner_not_registered, run_in_progress, run_errored, stale_run, insufficient_samples, below_threshold, regression, baseline_invalid, integrity_failed, suite_not_found, gate_error"
              suite_ref: { type: string }
              message: { type: string }
        runs:
          type: array
          items:
            type: object
            required: [suite_ref, required_threshold]
            properties:
              suite_ref: { type: string }
              run_id: { type: [string, "null"] }
              overall: { type: [number, "null"] }
              required_threshold: { type: number }
              sample_size: { type: [integer, "null"] }
              finished_at: { type: [string, "null"] }
              baseline_run_id: { type: [string, "null"] }
              delta: { type: [number, "null"] }
              regression: { type: [boolean, "null"] }
              p_value: { type: [number, "null"] }
        checked_at: { type: string, format: date-time }
    EvalComparison:
      type: object
      required: [comparable, baseline_run_id, tolerance, regression, blocking]
      properties:
        comparable: { type: boolean }
        baseline_run_id: { type: string }
        delta: { type: [number, "null"] }
        per_grader_delta: { type: object, additionalProperties: { type: number } }
        tolerance: { type: number }
        regression: { type: boolean }
        blocking: { type: boolean }
        significance:
          type: object
          properties:
            test: { type: string }
            method: { enum: [exact, monte_carlo, degenerate] }
            n: { type: integer }
            mean_diff: { type: number }
            p_value: { type: number }
            alpha: { type: number }
            significant: { type: boolean }
    EvalCase:
      type: object
      required: [id, input]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$" }
        input: {}
        expected: {}
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 60 } }
        metadata: { type: object }
    EvalDataset:
      type: object
      required: [name, version, ref, phi, case_count, content_hash, created_at]
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
        ref: { type: string }
        description: { type: [string, "null"] }
        phi: { type: boolean }
        redacted: { type: boolean }
        case_count: { type: integer }
        content_hash: { type: string }
        version_hash: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    EvalDatasetVersion:
      type: object
      required: [name, version, ref, phi, case_count, content_hash, created_at, cases]
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
        ref: { type: string }
        description: { type: [string, "null"] }
        phi: { type: boolean }
        redacted: { type: boolean }
        case_count: { type: integer }
        content_hash: { type: string }
        version_hash: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        cases: { type: array, items: { $ref: "#/components/schemas/EvalCase" } }
    EvalGrader:
      type: object
      required: [id, kind]
      description: |
        The runner's grader shape. `kind` is `deterministic` (`config.type`: exact, contains, not_contains, regex, json_schema,
        numeric_tolerance, tool_sequence, tool_subsequence, policy_decision, budget), `model` (`config`: provider, model, rubric, ...) or
        `human` (`config`: rubric, sla_hours, double_grade, agreement_tolerance). `min_mean` fails a run whose mean for this grader is lower.
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
        kind: { enum: [deterministic, model, human] }
        weight: { type: number, exclusiveMinimum: 0, maximum: 100 }
        config: { type: object }
        min_mean: { type: [number, "null"], minimum: 0, maximum: 1 }
    EvalSuite:
      type: object
      required:
        [
          ref,
          name,
          version,
          dataset_ref,
          dataset_hash,
          graders,
          pass_threshold,
          tolerance,
          suite_hash,
          created_at,
        ]
      properties:
        ref: { type: string }
        name: { type: string }
        version: { type: string }
        dataset_ref: { type: string }
        dataset_hash: { type: string }
        graders: { type: array, items: { $ref: "#/components/schemas/EvalGrader" } }
        pass_threshold: { type: number }
        min_case_score: { type: [number, "null"] }
        settings: { type: object }
        tolerance: { type: number }
        required_for_release: { type: boolean }
        applies_to: { type: array, items: { type: string } }
        min_samples: { type: [integer, "null"] }
        max_age_days: { type: integer }
        regression_requires_significance: { type: boolean }
        alpha: { type: number }
        suite_hash: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    EvalBaseline:
      type: object
      required: [blueprint_name, suite_ref, seq, run_id, overall, set_by, at]
      properties:
        blueprint_name: { type: string }
        suite_ref: { type: string }
        seq: { type: integer }
        run_id: { type: string }
        overall: { type: number }
        record_hash: { type: string }
        set_by: { type: string }
        at: { type: string, format: date-time }
    EvalReviewTask:
      type: object
      required:
        [id, run_id, suite_ref, case_id, grader_id, rubric, state, sla_deadline, sla_breached]
      properties:
        id: { type: string }
        run_id: { type: string }
        suite_ref: { type: string }
        case_id: { type: string }
        grader_id: { type: string }
        rubric: { type: string }
        blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
        case_input: {}
        case_output: { type: [string, "null"] }
        case_expected: {}
        state: { enum: [open, claimed, needs_adjudication, resolved] }
        created_at: { type: string, format: date-time }
        sla_deadline: { type: string, format: date-time }
        sla_breached: { type: boolean }
        double_grade: { type: boolean }
        claimed_by: { type: [string, "null"] }
        claim_expires_at: { type: [string, "null"], format: date-time }
        grades:
          type: array
          items:
            type: object
            required: [reviewer, score, comment, at, adjudication]
            properties:
              reviewer: { type: string }
              score: { type: number }
              comment: { type: string }
              at: { type: string, format: date-time }
              adjudication: { type: boolean }
        resolution:
          type: [object, "null"]
          properties:
            score: { type: number }
            method: { enum: [single, agreed, adjudicated] }
    EvalSamplingConfig:
      type: object
      required: [id, blueprint_name, suite_ref, rate, max_per_hour, redaction, enabled]
      properties:
        id: { type: string }
        blueprint_name: { type: string }
        suite_ref: { type: string }
        rate: { type: number }
        max_per_hour: { type: integer }
        redaction: { enum: [phi, always] }
        enabled: { type: boolean }
        alert_threshold: { type: [number, "null"] }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    EvalOnlineSummary:
      type: object
      required: [sampling_id, blueprint_name, suite_ref, enabled, count, window, alerting, recent]
      properties:
        sampling_id: { type: string }
        blueprint_name: { type: string }
        suite_ref: { type: string }
        enabled: { type: boolean }
        count: { type: integer }
        mean: { type: [number, "null"] }
        window:
          type: object
          required: [count]
          properties:
            count: { type: integer }
            mean: { type: [number, "null"] }
        alert_threshold: { type: [number, "null"] }
        alerting: { type: boolean }
        recent:
          type: array
          items:
            type: object
            required: [at, score]
            properties:
              at: { type: string, format: date-time }
              score: { type: number }
              blueprint_version: { type: string }
              trace_id: { type: [string, "null"] }
    EvalRunner:
      type: object
      required: [runner_id, registered_at]
      properties:
        runner_id: { type: string }
        description: { type: [string, "null"] }
        registered_by: { type: string }
        registered_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revoked_by: { type: [string, "null"] }
    Explanation:
      type: object
      required: [summary, steps, decision_refs, remediation]
      properties:
        summary: { type: string, description: Plain-language summary derived from the audit rows }
        steps:
          type: array
          items:
            type: object
            required: [n, kind, text]
            properties:
              n: { type: integer, minimum: 1 }
              kind: { enum: [request, evaluation, outcome, context, run] }
              text: { type: string }
              audit_event_id: { type: string, format: uuid }
              seq: { type: integer, minimum: 1 }
        decision_refs:
          type: array
          description: The audited decisions the explanation rests on
          items:
            type: object
            required:
              [
                audit_event_id,
                seq,
                decision,
                enforcement_point,
                action,
                policy_version,
                gate,
                rule_ids,
                reason,
              ]
            properties:
              audit_event_id: { type: string, format: uuid }
              seq: { type: integer, minimum: 1 }
              ts: { type: string, format: date-time }
              decision: { $ref: "#/components/schemas/Decision" }
              enforcement_point: { type: string }
              action: { type: string }
              policy_version: { type: string }
              policy_packs: { type: array, items: { type: string } }
              gate:
                enum:
                  [
                    kill_switch,
                    policy_rule,
                    default_deny,
                    amount_cap,
                    target_cap,
                    budget,
                    rate_limit,
                    staleness,
                    approval,
                    audit_unavailable,
                    invalid_request,
                    evaluation_failure,
                    admin,
                    other,
                  ]
              rule_ids: { type: array, items: { type: string } }
              gate_id: { type: string }
              kill_switch_scope: { enum: [global, tenant, agent, tool] }
              approval_id: { type: string, format: uuid }
              reason: { type: string }
        remediation:
          type: array
          description: What would allow the action; derived from the audit reason and the tenant's own policy metadata
          items:
            type: object
            required: [kind, text]
            properties:
              kind:
                enum:
                  [
                    release_kill_switch,
                    add_policy_rule,
                    review_policy_rule,
                    adjust_request,
                    raise_limit,
                    wait,
                    decide_approval,
                    retry,
                    contact_operator,
                    inspect,
                  ]
              text: { type: string }
              hint: { type: string }
        narrative:
          type: string
          description: Optional model-written prose; present only when the operator enabled the narrator
    Identity:
      type: object
      required: [tenant, member, credential]
      properties:
        tenant:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            region: { type: string }
        member:
          type: object
          required: [id, role]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
            role: { enum: [owner, admin, builder, operator, auditor, billing, viewer] }
        credential:
          type: object
          required: [kind]
          properties:
            kind: { enum: [session, api_key] }
            scopes: { type: array, items: { type: string } }
    RegistryNamespace:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string }
        public: { type: boolean }
        created_at: { type: string, format: date-time }
    RegistryKey:
      type: object
      required: [key_id, public_key, valid_from]
      properties:
        key_id: { type: string }
        public_key: { type: string }
        valid_from: { type: string, format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revoke_reason: { type: [string, "null"] }
    RegistrySignature:
      type: object
      required: [key_id, signed_at, sig]
      additionalProperties: false
      properties:
        key_id: { type: string }
        signed_at: { type: string, format: date-time }
        sig:
          {
            type: string,
            description: base64url Ed25519 signature over the canonical signed message,
          }
    DsseEnvelope:
      type: object
      required: [payloadType, payload, signatures]
      properties:
        payloadType: { type: string }
        payload: { type: string, description: base64 of the canonical in-toto statement }
        signatures:
          type: array
          items:
            type: object
            required: [keyid, sig]
            properties:
              keyid: { type: string }
              sig: { type: string }
    RegistryEvalAttestation:
      type: object
      required: [run_id, suite_ref, overall, content_hash, attached_at, verified, predicate, envelope]
      properties:
        run_id: { type: string }
        suite_ref: { type: string }
        overall: { type: number, minimum: 0, maximum: 1 }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        attached_at: { type: string, format: date-time }
        verified:
          type: boolean
          description: The envelope verified against the trusted eval hub keys, and is about this version's name and content hash
        predicate:
          description: The decoded eval-result summary of the statement; null unless `verified`
          type: [object, "null"]
          additionalProperties: true
        envelope: { $ref: "#/components/schemas/DsseEnvelope" }
    RegistryVersion:
      type: object
      required: [namespace, name, version, content_hash, risk_level, signature, published_at]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { enum: [minimal, limited, high] }
        signature: { $ref: "#/components/schemas/RegistrySignature" }
        published_at: { type: string, format: date-time }
        published_by: { type: string }
        state: { enum: [active, deprecated, yanked] }
        state_reason: { type: [string, "null"] }
    ResolvedBlueprint:
      type: object
      description: A registry version after verification, with its ABL document, provenance and what was verified
      required:
        [
          namespace,
          name,
          version,
          content_hash,
          risk_level,
          signature,
          published_at,
          abl,
          provenance,
          verification,
        ]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { enum: [minimal, limited, high] }
        signature: { $ref: "#/components/schemas/RegistrySignature" }
        published_at: { type: string, format: date-time }
        published_by: { type: string }
        state: { enum: [active, deprecated, yanked] }
        state_reason: { type: [string, "null"] }
        abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
        provenance: { $ref: "#/components/schemas/DsseEnvelope" }
        verification:
          type: object
          description: What the registry re-verified before answering (signing key, builder, source, compiler)
          required: [key_id]
          properties:
            key_id: { type: string }
            builder: { type: string }
            source_ref: { type: string }
            compiler_version: { type: string }
    MarketplaceListing:
      type: object
      required: [namespace, name, title, summary, categories, versions]
      properties:
        namespace: { type: string }
        name: { type: string }
        title: { type: string }
        summary: { type: string }
        categories: { type: array, items: { type: string } }
        publisher: { type: string }
        latest:
          type: [object, "null"]
          properties:
            version: { type: string }
            content_hash: { type: string }
            risk_level: { type: string }
            max_severity: { type: string }
        versions:
          { type: array, items: { type: string }, description: "Approved, installable versions" }
    Capability:
      type: object
      required: [key, level]
      properties:
        key: { type: string }
        level: { type: number }
    InstallPreview:
      type: object
      required:
        [
          namespace,
          name,
          version,
          content_hash,
          risk_level,
          findings,
          capabilities,
          diff,
          consent_digest,
        ]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { type: string }
        max_severity: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [id, severity, message]
            properties:
              id: { type: string }
              severity: { type: string }
              path: { type: string }
              message: { type: string }
        capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" } }
        diff:
          type: object
          description: Requested permissions versus what your tenant has granted; `widening` means consent is required
          required: [added, removed, widening]
          properties:
            added:
              type: array
              items:
                type: object
                required: [key, change, level]
                properties:
                  key: { type: string }
                  change: { enum: [new, raised] }
                  level: { type: number }
                  previous_level: { type: [number, "null"] }
            removed:
              type: array
              items:
                type: object
                required: [key, level]
                properties:
                  key: { type: string }
                  level: { type: number }
                  new_level: { type: [number, "null"] }
            widening: { type: boolean }
        consent_digest:
          {
            type: string,
            description: Echo it on install to prove you saw this exact diff of this exact blueprint,
          }
    MarketplaceInstall:
      type: object
      required: [id, namespace, name, version, content_hash, state, granted]
      properties:
        id: { type: string }
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        state: { enum: [active, flagged, uninstalled] }
        granted: { type: array, items: { $ref: "#/components/schemas/Capability" } }
        consented_by: { type: string }
        consented_at: { type: string, format: date-time }
        flag_reason: { type: [string, "null"] }

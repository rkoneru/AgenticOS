      responses:
        "200":
          description: Configurations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EvalSamplingConfig" } }
        default: { $ref: "#/components/responses/Problem" }
  /evals/sampling/{samplingId}:
    put:
      tags: [Evals]
      operationId: putEvalSamplingConfig
      summary: Create or replace an online sampling configuration (admin)
      parameters: [{ $ref: "#/components/parameters/EvalSamplingId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, suite, rate, max_per_hour]
              additionalProperties: false
              properties:
                blueprint: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
                suite: { type: string }
                rate: { type: number, minimum: 0, maximum: 1 }
                max_per_hour: { type: integer, minimum: 1, maximum: 100000 }
                redaction: { enum: [phi, always] }
                enabled: { type: boolean }
                alert_threshold: { type: [number, "null"], minimum: 0, maximum: 1 }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalSamplingConfig" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }

    get:
      tags: [Registry]
      operationId: listRegistryVersions
      summary: List the versions of a registry blueprint with their status
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistryVersion" } }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/blueprints/{namespace}/{name}/versions/{version}/eval-attestations:
    get:
      tags: [Registry]
      operationId: listRegistryEvalAttestations
      summary: Signed eval-result attestations attached to a version (its eval history, as the Eval Hub vouches for it)
      description: |
        Every finished eval run of this exact content is attested by the Eval Hub and attached append-only. Each envelope is
        re-verified against the trusted hub keys on every read (`verified`); a summary (`predicate`) is shown only when it verifies.
        Same visibility as the version itself (the owner, or everyone once the version is released).
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Attestations, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RegistryEvalAttestation" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

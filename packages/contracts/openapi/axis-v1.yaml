        "200":
          description: The new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceSystem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /compliance/impact-assessments:
    get:
      tags: [Compliance]
      operationId: listComplianceImpactAssessments
      summary: List AI impact assessments (latest version of each), with derived overdue flags
      parameters:
        - { name: system_id, in: query, schema: { type: string, maxLength: 63 } }
        - { name: state, in: query, schema: { enum: [draft, in_review, approved, rejected] } }
        - { name: overdue, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Assessments, ordered by id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ComplianceImpactAssessment" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Compliance]
      operationId: createComplianceImpactAssessment
      summary: Start an AI impact assessment of an inventoried system (draft, version 1)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceImpactAssessmentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceImpactAssessment" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /compliance/impact-assessments/{assessmentId}:
    get:
      tags: [Compliance]
      operationId: getComplianceImpactAssessment
      summary: Get an impact assessment (the latest version, or an earlier one with `version`)
      parameters:
        - { $ref: "#/components/parameters/ComplianceAssessmentId" }
        - { name: version, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceImpactAssessment" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Compliance]
      operationId: reviseComplianceImpactAssessment
      summary: Edit the draft in place, or start the next version when the latest was approved or rejected
      parameters: [{ $ref: "#/components/parameters/ComplianceAssessmentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceImpactAssessmentUpdate" }
      responses:
        "200":
          description: The edited or new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceImpactAssessment" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /compliance/impact-assessments/{assessmentId}/submit:
    post:
      tags: [Compliance]
      operationId: submitComplianceImpactAssessment
      summary: Submit a draft for independent review
      parameters:
        - { $ref: "#/components/parameters/ComplianceAssessmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceExpectedVersion" }
      responses:
        "200":
          description: In review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceImpactAssessment" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /compliance/impact-assessments/{assessmentId}/withdraw:
    post:
      tags: [Compliance]
      operationId: withdrawComplianceImpactAssessment
      summary: Take a submitted assessment back to draft
      parameters:
        - { $ref: "#/components/parameters/ComplianceAssessmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComplianceExpectedVersion" }
      responses:
        "200":
          description: Back to draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceImpactAssessment" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /compliance/impact-assessments/{assessmentId}/review:
    post:
      tags: [Compliance]
      operationId: reviewComplianceImpactAssessment
      summary: Approve or reject a submitted assessment (the reviewer is never the author, a contributor or the submitter)
      parameters:
        - { $ref: "#/components/parameters/ComplianceAssessmentId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, decision]
              additionalProperties: false
              properties:
                expected_version: { type: integer, minimum: 1 }
                decision: { enum: [approve, reject] }
                comment: { type: string, maxLength: 2000, description: Required when rejecting }
      responses:
        "200":
          description: Approved or rejected (final for this version)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceImpactAssessment" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /compliance/documents:
    get:
      tags: [Compliance]
      operationId: listComplianceDocuments
      summary: List generated technical documentation (EU AI Act Annex IV structure), oldest version first
      parameters:
        - {
            name: blueprint_name,
            in: query,
            schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" },
          }
        - { name: blueprint_version, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: Documents without their bodies
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ComplianceDocumentSummary" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Compliance]
      operationId: generateComplianceDocument
      summary: Assemble and seal the technical documentation of a blueprint version from the platform's own records
      description: |
        Reads this tenant's registry/blueprint record, eval runs and attestations, active policy packs and audit statistics.
        Anything that cannot be read is listed in the document as a gap; nothing is invented. The same sources give the same bytes:
        when nothing changed since the latest version, that version is returned (`created: false`) and nothing is stored.
        The document is designed for and evidence-ready toward Annex IV; it is not a conformity assessment.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              additionalProperties: false
              properties:
                blueprint: { $ref: "#/components/schemas/ComplianceBlueprintRef" }
      responses:
        "201":
          description: A new version was stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceGenerateResult" }
        "200":
          description: Unchanged since the latest version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceGenerateResult" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /compliance/documents/{documentId}:
    get:
      tags: [Compliance]
      operationId: getComplianceDocument
      summary: Get a generated document with a fresh verification of its hash, Markdown and seal
      parameters: [{ $ref: "#/components/parameters/ComplianceDocumentId" }]
      responses:
        "200":
          description: The document and its verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceDocumentView" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/dsar-requests:
    get:
      tags: [Governance]
      operationId: listGovernanceDsarRequests
      summary: List data-subject requests (the queue), newest first
      parameters:
        - {
            name: status,
            in: query,
            schema: { enum: [received, verified, processing, completed, rejected, cancelled] },
          }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    { type: array, items: { $ref: "#/components/schemas/GovernanceDsarRequest" } }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Governance]
      operationId: createGovernanceDsarRequest
      summary: Open a data-subject request; the 30-day clock starts now. Identifiers are sealed at rest and never echoed back
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, identifiers]
              additionalProperties: false
              properties:
                kind: { enum: [export, erase, restrict] }
                identifiers:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: "#/components/schemas/GovernanceIdentifier" }
                destination_region:
                  {
                    type: string,
                    description: "Export only: the region the bundle is delivered to; refused when residency forbids it",
                  }
      responses:
        "201":
          description: Opened (status received)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceDsarRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/dsar-requests/{requestId}:
    get:
      tags: [Governance]
      operationId: getGovernanceDsarRequest
      summary: Get one request with its result (per-store counts, verification evidence)
      parameters: [{ $ref: "#/components/parameters/GovernanceRequestId" }]
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceDsarRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/dsar-requests/{requestId}/verify:
    post:
      tags: [Governance]
      operationId: verifyGovernanceDsarRequest
      summary: Verify the requester's identity with the evidence the configured verifier accepts; nothing is exported or erased before this succeeds
      parameters:
        - { $ref: "#/components/parameters/GovernanceRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              additionalProperties: false
              properties:
                evidence:
                  type: object
                  additionalProperties: true
                  description: "Verifier-specific (the shipped verifier: a signed requester token and the tenant admin's attestation)"
      responses:
        "200":
          description: The request; status verified when the evidence was accepted, unchanged (and the failure audited) when not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceDsarRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/dsar-requests/{requestId}/export:
    post:
      tags: [Governance]
      operationId: exportGovernanceDsarRequest
      summary: Produce the signed export bundle of everything the stores hold about the verified subject
      parameters:
        - { $ref: "#/components/parameters/GovernanceRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Manifest, records per store and an Ed25519 signature over the manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceExportBundle" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/dsar-requests/{requestId}/erase:
    post:
      tags: [Governance]
      operationId: eraseGovernanceDsarRequest
      summary: Erase the verified subject from every store, verify that nothing identifiable remains, then shred the lookup keys. Held data is not touched (status held)
      parameters:
        - { $ref: "#/components/parameters/GovernanceRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: "Outcome per store; status completed, held (a legal hold covers a store) or partial"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceEraseOutcome" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/dsar-requests/{requestId}/restrict:
    post:
      tags: [Governance]
      operationId: restrictGovernanceDsarRequest
      summary: "Apply a restriction of processing for the verified subject (Art. 18): the data stays, active processing is refused"
      parameters:
        - { $ref: "#/components/parameters/GovernanceRequestId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: The request, completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceDsarRequest" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/holds:
    get:
      tags: [Governance]
      operationId: listGovernanceHolds
      summary: List legal holds and restrictions (active ones unless `all`)
      parameters:
        - { name: all, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Holds
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/GovernanceHold" } }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Governance]
      operationId: placeGovernanceHold
      summary: Place a legal hold (tenant, subject or case scope); purge and erasure of matching data are suspended until it is released
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              additionalProperties: false
              properties:
                scope: { enum: [tenant, subject, case] }
                reason: { type: string, minLength: 1, maxLength: 1000 }
                case_ref: { type: string, maxLength: 200 }
                classes:
                  type: array
                  items: { $ref: "#/components/schemas/GovernanceDataClass" }
                  description: Omitted = every class
                groups:
                  type: array
                  description: "Subject and case scope: one list of identifiers per person the hold covers"
                  items:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/GovernanceIdentifier" }
      responses:
        "201":
          description: Placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceHold" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/holds/{holdId}/release:
    post:
      tags: [Governance]
      operationId: releaseGovernanceHold
      summary: Release a legal hold; suspended purges and erasures may proceed on their next run
      parameters:
        - { $ref: "#/components/parameters/GovernanceHoldId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceHold" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/retention:
    get:
      tags: [Governance]
      operationId: getGovernanceRetention
      summary: Requested and effective retention per data class (effective is clamped into the class's legal bounds)
      responses:
        "200":
          description: One entry per class
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/GovernanceRetentionClass" },
                    }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/retention/{dataClass}:
    put:
      tags: [Governance]
      operationId: setGovernanceRetention
      summary: Set the retention period of a governance-owned class (run_logs, eval_data, telemetry, billing); the others are tenant settings
      parameters: [{ $ref: "#/components/parameters/GovernanceDataClass" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              additionalProperties: false
              properties:
                days: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [data_class, days]
                properties:
                  data_class: { $ref: "#/components/schemas/GovernanceDataClass" }
                  days: { type: integer }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/retention-runs:
    get:
      tags: [Governance]
      operationId: listGovernanceRetentionRuns
      summary: Retention reports (dry runs and purges), newest first
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/GovernanceRetentionReport" },
                    }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Governance]
      operationId: runGovernanceRetention
      summary: "Run retention. dry_run defaults to true: it reports what would be purged and changes nothing. The audit class is never purged"
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: { type: boolean, default: true }
                classes:
                  type: array
                  items: { $ref: "#/components/schemas/GovernanceDataClass" }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceRetentionReport" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /governance/residency:
    get:
      tags: [Governance]
      operationId: getGovernanceResidency
      summary: The tenant's residency policy (home region and the regions its data may be written to)
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernanceResidency" }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      {
        type: http,
        scheme: bearer,
        bearerFormat: JWT,
        description: Short-lived token issued via WorkOS SSO,
      }
    apiKey: { type: apiKey, in: header, name: X-Axis-Api-Key }
  parameters:
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    Namespace:
      {
        name: namespace,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" },
      }
    EvalRunId: { name: evalRunId, in: path, required: true, schema: { type: string, format: uuid } }
    EvalTaskId: { name: taskId, in: path, required: true, schema: { type: string, maxLength: 100 } }
    EvalSamplingId:
      {
        name: samplingId,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$" },
      }
    EvalRunnerId:
      {
        name: runnerId,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$" },
      }
    ComplianceSystemId:
      {
        name: systemId,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" },
      }
    ComplianceAssessmentId:
      {
        name: assessmentId,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$" },
      }
    ComplianceDocumentId:
      {
        name: documentId,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$" },
      }
    GovernanceRequestId:
      { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    GovernanceHoldId:
      { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
    GovernanceDataClass:
      {
        name: dataClass,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/GovernanceDataClass" },
      }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key; replays within 24 h return the original response.
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationProblem:
      description: The document failed schema or lint validation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblemBody" }
  schemas:
    Pid: { type: string, pattern: "^axp_[0-9A-HJKMNP-TV-Z]{26}$" }
    ProcessState: { enum: [spawn, ready, running, waiting, suspended, terminated] }
    Signal: { enum: [PAUSE, RESUME, TERM, KILL, INTERRUPT] }
    Decision: { enum: [ALLOW, DENY, REQUIRE_APPROVAL, ALLOW_WITH_REDACTION] }
    ApprovalStatus: { enum: [pending, approved, rejected, expired, escalated] }
    Meter:
      {
        enum:
          [
            tokens,
            runtime_seconds,
            tool_executions,
            voice_minutes,
            storage_gb_hours,
            marketplace_installs,
          ],
      }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: "URI, e.g. https://axis.example/problems/policy_denied" }
        title: { type: string }
        status: { type: integer }
        code:
          {
            enum:
              [
                unauthenticated,
                forbidden,
                policy_denied,
                not_found,
                conflict,
                validation_failed,
                rate_limited,
                budget_exceeded,
                internal,
              ],
          }
        detail: { type: string }
        trace_id: { type: string }
    ValidationProblemBody:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  { path: { type: string }, keyword: { type: string }, message: { type: string } }
    BlueprintVersion:
      type: object
      required: [name, version, risk_level, created_at, abl]
      properties:
        name: { type: string }
        version: { type: string }
        risk_level: { enum: [minimal, limited, high] }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        signature: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
    BlueprintPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BlueprintVersion" } }
        next_cursor: { type: [string, "null"] }
    Run:
      type: object
      required: [id, blueprint, state, created_at]
      properties:
        id: { type: string, format: uuid }
        init_pid: { $ref: "#/components/schemas/Pid" }
        blueprint:
          type: object
          required: [name, version]
          properties: { name: { type: string }, version: { type: string } }
        state: { $ref: "#/components/schemas/ProcessState" }
        exit_reason: { type: [string, "null"] }
        trace_id: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    RunPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
        next_cursor: { type: [string, "null"] }
    RunEvent:
      type: object
      required: [sequence, type, pid, at]
      properties:
        sequence: { type: integer, minimum: 1 }
        type:
          {
            type: string,
            description: "state_transition, model_call, tool_call, gate_decision, message, ...",
          }
        pid: { $ref: "#/components/schemas/Pid" }
        at: { type: string, format: date-time }
        audit_event_id: { type: string, format: uuid }
        data: { type: object }
    GateDecision:
      type: object
      required: [decision, policy_version]
      properties:
        decision: { $ref: "#/components/schemas/Decision" }
        policy_version: { type: string }
        reason: { type: string }
        matched_rule_ids: { type: array, items: { type: string } }
        redact_fields: { type: array, items: { type: string } }
    Approval:
      type: object
      required: [id, status, run_id, requested_at, sla_deadline]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        run_id: { type: string, format: uuid }
        pid: { $ref: "#/components/schemas/Pid" }
        action: { type: string }
        roles: { type: array, items: { type: string } }
        requested_at: { type: string, format: date-time }
        sla_deadline: { type: string, format: date-time }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        comment: { type: [string, "null"] }
    ApprovalPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        next_cursor: { type: [string, "null"] }
    PolicyPack:
      type: object
      required: [name, version, created_at]
      properties:
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        created_at: { type: string, format: date-time }
        version_id: { type: string, format: uuid, description: Id to pass to activatePolicyPack }
        active:
          {
            type: boolean,
            description: Whether this version is the tenant's active version of the pack,
          }
    PolicyPackPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PolicyPack" } }
        next_cursor: { type: [string, "null"] }
    KillSwitchRequest:
      type: object
      required: [scope, engaged]
      additionalProperties: false
      properties:
        scope: { enum: [tenant, agent, tool] }
        target: { type: string, description: Required for agent and tool scopes }
        engaged: { type: boolean }
        reason: { type: string, maxLength: 500 }
    KillSwitch:
      type: object
      required: [scope, engaged, updated_at]
      properties:
        scope: { enum: [global, tenant, agent, tool] }
        target: { type: [string, "null"] }
        engaged: { type: boolean }
        reason: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
    EvalRun:
      type: object
      required: [id, suite, status]
      properties:
        id: { type: string, format: uuid }
        suite: { type: string }
        status: { enum: [queued, running, passed, failed, errored] }
        score: { type: [number, "null"] }
        threshold: { type: [number, "null"] }
        blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
        mode: { enum: [ci, manual] }
        scores: { $ref: "#/components/schemas/EvalScores" }
        sample_size: { type: integer }
        pending_human: { type: integer }
        cost:
          type: object
          properties:
            agent_usd: { type: string }
            judge_usd: { type: string }
            total_usd: { type: string }
            tokens: { type: integer }
            judge_tokens: { type: integer }
        runner_id: { type: [string, "null"] }
        requested_by: { type: string }
        provenance: { type: [object, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        failure_reason: { type: [string, "null"] }
        record_hash: { type: [string, "null"] }
    EvalBlueprintRef:
      type: object
      required: [name, version, content_hash]
      additionalProperties: false
      properties:
        namespace: { type: [string, "null"] }
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        version: { type: string, minLength: 1, maxLength: 64 }
        content_hash:
          {
            type: string,
            pattern: "^[0-9a-f]{64}$",
            description: SHA-256 of the canonical ABL; a run counts only for exactly this content,
          }
    EvalScores:
      type: object
      required: [status, overall, per_grader, per_case, passed, failures, ungraded]
      properties:
        status: { enum: [complete, pending_human] }
        overall: { type: [number, "null"], minimum: 0, maximum: 1 }
        per_grader: { type: object, additionalProperties: { type: number } }
        per_case: { type: object, additionalProperties: { type: number } }
        passed: { type: [boolean, "null"] }
        failures: { type: array, items: { type: string } }
        ungraded: { type: integer }
    EvalCaseResult:
      type: object
      required: [case_id, status, grades]
      properties:
        case_id: { type: string }
        status: { type: string }
        attempts: { type: integer }
        seed: { type: integer }
        error: { type: [string, "null"] }
        score: { type: [number, "null"] }
        output: { type: [string, "null"] }
        grades:
          type: array
          items:
            type: object
            required: [grader_id, kind, status, score]
            properties:
              grader_id: { type: string }
              kind: { enum: [deterministic, model, human] }
              status: { enum: [scored, ungraded, pending, error] }
              score: { type: number }
              detail: { type: string }
              provenance: { type: object }
        trace: { type: [object, "null"] }
    EvalRunDetail:
      type: object
      required: [id, suite, status, case_results]
      properties:
        id: { type: string, format: uuid }
        suite: { type: string }
        status: { enum: [queued, running, passed, failed, errored] }
        score: { type: [number, "null"] }
        threshold: { type: [number, "null"] }
        blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
        mode: { enum: [ci, manual] }
        scores: { $ref: "#/components/schemas/EvalScores" }
        sample_size: { type: integer }
        pending_human: { type: integer }
        cost:
          type: object
          properties:
            agent_usd: { type: string }
            judge_usd: { type: string }
            total_usd: { type: string }
            tokens: { type: integer }
            judge_tokens: { type: integer }
        runner_id: { type: [string, "null"] }
        requested_by: { type: string }
        provenance: { type: [object, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        failure_reason: { type: [string, "null"] }
        record_hash: { type: [string, "null"] }
        case_results: { type: array, items: { $ref: "#/components/schemas/EvalCaseResult" } }
    EvalRunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EvalRun" } }
        next_cursor: { type: [string, "null"] }
    EvalGateResult:
      type: object
      required: [allowed, blueprint, reasons, runs, checked_at]
      properties:
        allowed: { type: boolean }
        blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
        reasons:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
                description: "missing_run, no_run_for_content_hash, runner_not_registered, run_in_progress, run_errored, stale_run, insufficient_samples, below_threshold, regression, baseline_invalid, integrity_failed, suite_not_found, gate_error"
              suite_ref: { type: string }
              message: { type: string }
        runs:
          type: array
          items:
            type: object
            required: [suite_ref, required_threshold]
            properties:
              suite_ref: { type: string }
              run_id: { type: [string, "null"] }
              overall: { type: [number, "null"] }
              required_threshold: { type: number }
              sample_size: { type: [integer, "null"] }
              finished_at: { type: [string, "null"] }
              baseline_run_id: { type: [string, "null"] }
              delta: { type: [number, "null"] }
              regression: { type: [boolean, "null"] }
              p_value: { type: [number, "null"] }
        checked_at: { type: string, format: date-time }
    EvalComparison:
      type: object
      required: [comparable, baseline_run_id, tolerance, regression, blocking]
      properties:
        comparable: { type: boolean }
        baseline_run_id: { type: string }
        delta: { type: [number, "null"] }
        per_grader_delta: { type: object, additionalProperties: { type: number } }
        tolerance: { type: number }
        regression: { type: boolean }
        blocking: { type: boolean }
        significance:
          type: object
          properties:
            test: { type: string }
            method: { enum: [exact, monte_carlo, degenerate] }
            n: { type: integer }
            mean_diff: { type: number }
            p_value: { type: number }
            alpha: { type: number }
            significant: { type: boolean }
    EvalCase:
      type: object
      required: [id, input]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$" }
        input: {}
        expected: {}
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 60 } }
        metadata: { type: object }
    EvalDataset:
      type: object
      required: [name, version, ref, phi, case_count, content_hash, created_at]
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
        ref: { type: string }
        description: { type: [string, "null"] }
        phi: { type: boolean }
        redacted: { type: boolean }
        case_count: { type: integer }
        content_hash: { type: string }
        version_hash: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    EvalDatasetVersion:
      type: object
      required: [name, version, ref, phi, case_count, content_hash, created_at, cases]
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
        ref: { type: string }
        description: { type: [string, "null"] }
        phi: { type: boolean }
        redacted: { type: boolean }
        case_count: { type: integer }
        content_hash: { type: string }
        version_hash: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        cases: { type: array, items: { $ref: "#/components/schemas/EvalCase" } }
    EvalGrader:
      type: object
      required: [id, kind]
      description: |
        The runner's grader shape. `kind` is `deterministic` (`config.type`: exact, contains, not_contains, regex, json_schema,
        numeric_tolerance, tool_sequence, tool_subsequence, policy_decision, budget), `model` (`config`: provider, model, rubric, ...) or
        `human` (`config`: rubric, sla_hours, double_grade, agreement_tolerance). `min_mean` fails a run whose mean for this grader is lower.
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
        kind: { enum: [deterministic, model, human] }
        weight: { type: number, exclusiveMinimum: 0, maximum: 100 }
        config: { type: object }
        min_mean: { type: [number, "null"], minimum: 0, maximum: 1 }
    EvalSuite:
      type: object
      required:
        [
          ref,
          name,
          version,
          dataset_ref,
          dataset_hash,
          graders,
          pass_threshold,
          tolerance,
          suite_hash,
          created_at,
        ]
      properties:
        ref: { type: string }
        name: { type: string }
        version: { type: string }
        dataset_ref: { type: string }
        dataset_hash: { type: string }
        graders: { type: array, items: { $ref: "#/components/schemas/EvalGrader" } }
        pass_threshold: { type: number }
        min_case_score: { type: [number, "null"] }
        settings: { type: object }
        tolerance: { type: number }
        required_for_release: { type: boolean }
        applies_to: { type: array, items: { type: string } }
        min_samples: { type: [integer, "null"] }
        max_age_days: { type: integer }
        regression_requires_significance: { type: boolean }
        alpha: { type: number }
        suite_hash: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    EvalBaseline:
      type: object
      required: [blueprint_name, suite_ref, seq, run_id, overall, set_by, at]
      properties:
        blueprint_name: { type: string }
        suite_ref: { type: string }
        seq: { type: integer }
        run_id: { type: string }
        overall: { type: number }
        record_hash: { type: string }
        set_by: { type: string }
        at: { type: string, format: date-time }
    EvalReviewTask:
      type: object
      required:
        [id, run_id, suite_ref, case_id, grader_id, rubric, state, sla_deadline, sla_breached]
      properties:
        id: { type: string }
        run_id: { type: string }
        suite_ref: { type: string }
        case_id: { type: string }
        grader_id: { type: string }
        rubric: { type: string }
        blueprint: { $ref: "#/components/schemas/EvalBlueprintRef" }
        case_input: {}
        case_output: { type: [string, "null"] }
        case_expected: {}
        state: { enum: [open, claimed, needs_adjudication, resolved] }
        created_at: { type: string, format: date-time }
        sla_deadline: { type: string, format: date-time }
        sla_breached: { type: boolean }
        double_grade: { type: boolean }
        claimed_by: { type: [string, "null"] }
        claim_expires_at: { type: [string, "null"], format: date-time }
        grades:
          type: array
          items:
            type: object
            required: [reviewer, score, comment, at, adjudication]
            properties:
              reviewer: { type: string }
              score: { type: number }
              comment: { type: string }
              at: { type: string, format: date-time }
              adjudication: { type: boolean }
        resolution:
          type: [object, "null"]
          properties:
            score: { type: number }
            method: { enum: [single, agreed, adjudicated] }
    EvalSamplingConfig:
      type: object
      required: [id, blueprint_name, suite_ref, rate, max_per_hour, redaction, enabled]
      properties:
        id: { type: string }
        blueprint_name: { type: string }
        suite_ref: { type: string }
        rate: { type: number }
        max_per_hour: { type: integer }
        redaction: { enum: [phi, always] }
        enabled: { type: boolean }
        alert_threshold: { type: [number, "null"] }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    EvalOnlineSummary:
      type: object
      required: [sampling_id, blueprint_name, suite_ref, enabled, count, window, alerting, recent]
      properties:
        sampling_id: { type: string }
        blueprint_name: { type: string }
        suite_ref: { type: string }
        enabled: { type: boolean }
        count: { type: integer }
        mean: { type: [number, "null"] }
        window:
          type: object
          required: [count]
          properties:
            count: { type: integer }
            mean: { type: [number, "null"] }
        alert_threshold: { type: [number, "null"] }
        alerting: { type: boolean }
        recent:
          type: array
          items:
            type: object
            required: [at, score]
            properties:
              at: { type: string, format: date-time }
              score: { type: number }
              blueprint_version: { type: string }
              trace_id: { type: [string, "null"] }
    EvalRunner:
      type: object
      required: [runner_id, registered_at]
      properties:
        runner_id: { type: string }
        description: { type: [string, "null"] }
        registered_by: { type: string }
        registered_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revoked_by: { type: [string, "null"] }
    Explanation:
      type: object
      required: [summary, steps, decision_refs, remediation]
      properties:
        summary: { type: string, description: Plain-language summary derived from the audit rows }
        steps:
          type: array
          items:
            type: object
            required: [n, kind, text]
            properties:
              n: { type: integer, minimum: 1 }
              kind: { enum: [request, evaluation, outcome, context, run] }
              text: { type: string }
              audit_event_id: { type: string, format: uuid }
              seq: { type: integer, minimum: 1 }
        decision_refs:
          type: array
          description: The audited decisions the explanation rests on
          items:
            type: object
            required:
              [
                audit_event_id,
                seq,
                decision,
                enforcement_point,
                action,
                policy_version,
                gate,
                rule_ids,
                reason,
              ]
            properties:
              audit_event_id: { type: string, format: uuid }
              seq: { type: integer, minimum: 1 }
              ts: { type: string, format: date-time }
              decision: { $ref: "#/components/schemas/Decision" }
              enforcement_point: { type: string }
              action: { type: string }
              policy_version: { type: string }
              policy_packs: { type: array, items: { type: string } }
              gate:
                enum:
                  [
                    kill_switch,
                    policy_rule,
                    default_deny,
                    amount_cap,
                    target_cap,
                    budget,
                    rate_limit,
                    staleness,
                    approval,
                    audit_unavailable,
                    invalid_request,
                    evaluation_failure,
                    admin,
                    other,
                  ]
              rule_ids: { type: array, items: { type: string } }
              gate_id: { type: string }
              kill_switch_scope: { enum: [global, tenant, agent, tool] }
              approval_id: { type: string, format: uuid }
              reason: { type: string }
        remediation:
          type: array
          description: What would allow the action; derived from the audit reason and the tenant's own policy metadata
          items:
            type: object
            required: [kind, text]
            properties:
              kind:
                enum:
                  [
                    release_kill_switch,
                    add_policy_rule,
                    review_policy_rule,
                    adjust_request,
                    raise_limit,
                    wait,
                    decide_approval,
                    retry,
                    contact_operator,
                    inspect,
                  ]
              text: { type: string }
              hint: { type: string }
        narrative:
          type: string
          description: Optional model-written prose; present only when the operator enabled the narrator
    Identity:
      type: object
      required: [tenant, member, credential]
      properties:
        tenant:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            region: { type: string }
        member:
          type: object
          required: [id, role]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
            role:
              { enum: [owner, admin, builder, operator, auditor, billing, viewer, privacy_officer] }
        credential:
          type: object
          required: [kind]
          properties:
            kind: { enum: [session, api_key] }
            scopes: { type: array, items: { type: string } }
    RegistryNamespace:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string }
        public: { type: boolean }
        created_at: { type: string, format: date-time }
    RegistryKey:
      type: object
      required: [key_id, public_key, valid_from]
      properties:
        key_id: { type: string }
        public_key: { type: string }
        valid_from: { type: string, format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revoke_reason: { type: [string, "null"] }
    RegistrySignature:
      type: object
      required: [key_id, signed_at, sig]
      additionalProperties: false
      properties:
        key_id: { type: string }
        signed_at: { type: string, format: date-time }
        sig:
          {
            type: string,
            description: base64url Ed25519 signature over the canonical signed message,
          }
    DsseEnvelope:
      type: object
      required: [payloadType, payload, signatures]
      properties:
        payloadType: { type: string }
        payload: { type: string, description: base64 of the canonical in-toto statement }
        signatures:
          type: array
          items:
            type: object
            required: [keyid, sig]
            properties:
              keyid: { type: string }
              sig: { type: string }
    RegistryEvalAttestation:
      type: object
      required:
        [run_id, suite_ref, overall, content_hash, attached_at, verified, predicate, envelope]
      properties:
        run_id: { type: string }
        suite_ref: { type: string }
        overall: { type: number, minimum: 0, maximum: 1 }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        attached_at: { type: string, format: date-time }
        verified:
          type: boolean
          description: The envelope verified against the trusted eval hub keys, and is about this version's name and content hash
        predicate:
          description: The decoded eval-result summary of the statement; null unless `verified`
          type: [object, "null"]
          additionalProperties: true
        envelope: { $ref: "#/components/schemas/DsseEnvelope" }
    RegistryVersion:
      type: object
      required: [namespace, name, version, content_hash, risk_level, signature, published_at]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { enum: [minimal, limited, high] }
        signature: { $ref: "#/components/schemas/RegistrySignature" }
        published_at: { type: string, format: date-time }
        published_by: { type: string }
        state: { enum: [active, deprecated, yanked] }
        state_reason: { type: [string, "null"] }
    ResolvedBlueprint:
      type: object
      description: A registry version after verification, with its ABL document, provenance and what was verified
      required:
        [
          namespace,
          name,
          version,
          content_hash,
          risk_level,
          signature,
          published_at,
          abl,
          provenance,
          verification,
        ]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { enum: [minimal, limited, high] }
        signature: { $ref: "#/components/schemas/RegistrySignature" }
        published_at: { type: string, format: date-time }
        published_by: { type: string }
        state: { enum: [active, deprecated, yanked] }
        state_reason: { type: [string, "null"] }
        abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
        provenance: { $ref: "#/components/schemas/DsseEnvelope" }
        verification:
          type: object
          description: What the registry re-verified before answering (signing key, builder, source, compiler)
          required: [key_id]
          properties:
            key_id: { type: string }
            builder: { type: string }
            source_ref: { type: string }
            compiler_version: { type: string }
    MarketplaceListing:
      type: object
      required: [namespace, name, title, summary, categories, versions]
      properties:
        namespace: { type: string }
        name: { type: string }
        title: { type: string }
        summary: { type: string }
        categories: { type: array, items: { type: string } }
        publisher: { type: string }
        latest:
          type: [object, "null"]
          properties:
            version: { type: string }
            content_hash: { type: string }
            risk_level: { type: string }
            max_severity: { type: string }
        versions:
          { type: array, items: { type: string }, description: "Approved, installable versions" }
    Capability:
      type: object
      required: [key, level]
      properties:
        key: { type: string }
        level: { type: number }
    InstallPreview:
      type: object
      required:
        [
          namespace,
          name,
          version,
          content_hash,
          risk_level,
          findings,
          capabilities,
          diff,
          consent_digest,
        ]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { type: string }
        max_severity: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [id, severity, message]
            properties:
              id: { type: string }
              severity: { type: string }
              path: { type: string }
              message: { type: string }
        capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" } }
        diff:
          type: object
          description: Requested permissions versus what your tenant has granted; `widening` means consent is required
          required: [added, removed, widening]
          properties:
            added:
              type: array
              items:
                type: object
                required: [key, change, level]
                properties:
                  key: { type: string }
                  change: { enum: [new, raised] }
                  level: { type: number }
                  previous_level: { type: [number, "null"] }
            removed:
              type: array
              items:
                type: object
                required: [key, level]
                properties:
                  key: { type: string }
                  level: { type: number }
                  new_level: { type: [number, "null"] }
            widening: { type: boolean }
        consent_digest:
          {
            type: string,
            description: Echo it on install to prove you saw this exact diff of this exact blueprint,
          }
    MarketplaceInstall:
      type: object
      required: [id, namespace, name, version, content_hash, state, granted]
      properties:
        id: { type: string }
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        state: { enum: [active, flagged, uninstalled] }
        granted: { type: array, items: { $ref: "#/components/schemas/Capability" } }
        consented_by: { type: string }
        consented_at: { type: string, format: date-time }
        flag_reason: { type: [string, "null"] }
    ComplianceBlueprintRef:
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        version: { type: string, maxLength: 64 }
    ComplianceStakeholder:
      type: object
      required: [role, name]
      additionalProperties: false
      properties:
        role: { type: string, maxLength: 200 }
        name: { type: string, maxLength: 200 }
    ComplianceExpectedVersion:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties:
        expected_version:
          { type: integer, minimum: 1, description: The version you read; a stale one is a 409 }
    ComplianceSystemInput:
      type: object
      required: [name, purpose, owner, risk_level]
      additionalProperties: false
      properties:
        system_id:
          { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$", description: Generated when omitted }
        name: { type: string, maxLength: 200 }
        purpose: { type: string, maxLength: 4000 }
        owner: { type: string, maxLength: 200 }
        risk_level: { enum: [minimal, limited, high] }
        lifecycle_stage: { enum: [design, development, deployed, retired] }
        blueprints:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceBlueprintRef" },
          }
        data_categories: { type: array, maxItems: 100, items: { type: string, maxLength: 200 } }
        stakeholders:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceStakeholder" },
          }
    ComplianceSystemUpdate:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 200 }
        purpose: { type: string, maxLength: 4000 }
        owner: { type: string, maxLength: 200 }
        risk_level: { enum: [minimal, limited, high] }
        lifecycle_stage: { enum: [design, development, deployed, retired] }
        blueprints:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceBlueprintRef" },
          }
        data_categories: { type: array, maxItems: 100, items: { type: string, maxLength: 200 } }
        stakeholders:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceStakeholder" },
          }
    ComplianceSystem:
      type: object
      required:
        - system_id
        - version
        - name
        - purpose
        - owner
        - risk_level
        - lifecycle_stage
        - blueprints
        - data_categories
        - stakeholders
        - created_at
        - created_by
        - updated_at
        - updated_by
      properties:
        system_id: { type: string }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        purpose: { type: string }
        owner: { type: string }
        risk_level: { enum: [minimal, limited, high] }
        lifecycle_stage: { enum: [design, development, deployed, retired] }
        blueprints: { type: array, items: { $ref: "#/components/schemas/ComplianceBlueprintRef" } }
        data_categories: { type: array, items: { type: string } }
        stakeholders: { type: array, items: { $ref: "#/components/schemas/ComplianceStakeholder" } }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    ComplianceAffectedGroup:
      type: object
      required: [group, impact]
      additionalProperties: false
      properties:
        group: { type: string, maxLength: 200 }
        impact: { type: string, maxLength: 4000 }
    ComplianceAssessedRisk:
      type: object
      required: [id, description, likelihood, severity, mitigation, residual]
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 4000 }
        likelihood: { enum: [low, medium, high] }
        severity: { enum: [low, medium, high] }
        mitigation: { type: string, maxLength: 4000 }
        residual: { enum: [low, medium, high] }
    ComplianceImpactAssessmentInput:
      type: object
      required: [system_id, title, risk_rating, intended_use, review_due]
      additionalProperties: false
      properties:
        system_id: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        title: { type: string, maxLength: 200 }
        risk_rating: { enum: [low, medium, high, critical] }
        intended_use: { type: string, maxLength: 4000 }
        blueprints:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceBlueprintRef" },
          }
        affected_groups:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceAffectedGroup" },
          }
        risks:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceAssessedRisk" },
          }
        stakeholders:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceStakeholder" },
          }
        review_due:
          {
            type: string,
            pattern: "^\\d{4}-\\d{2}-\\d{2}$",
            description: The date by which the assessment must be reviewed again,
          }
    ComplianceImpactAssessmentUpdate:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        risk_rating: { enum: [low, medium, high, critical] }
        intended_use: { type: string, maxLength: 4000 }
        blueprints:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceBlueprintRef" },
          }
        affected_groups:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceAffectedGroup" },
          }
        risks:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceAssessedRisk" },
          }
        stakeholders:
          {
            type: array,
            maxItems: 100,
            items: { $ref: "#/components/schemas/ComplianceStakeholder" },
          }
        review_due: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    ComplianceImpactAssessment:
      type: object
      required:
        - assessment_id
        - version
        - system_id
        - title
        - state
        - risk_rating
        - intended_use
        - blueprints
        - affected_groups
        - risks
        - stakeholders
        - review_due
        - author
        - contributors
        - created_at
        - updated_at
        - submitted_by
        - submitted_at
        - reviewed_by
        - reviewed_at
        - review_comment
        - supersedes
        - overdue
        - overdue_reason
        - superseded
      properties:
        assessment_id: { type: string }
        version: { type: integer, minimum: 1 }
        system_id: { type: string }
        title: { type: string }
        state: { enum: [draft, in_review, approved, rejected] }
        risk_rating: { enum: [low, medium, high, critical] }
        intended_use: { type: string }
        blueprints: { type: array, items: { $ref: "#/components/schemas/ComplianceBlueprintRef" } }
        affected_groups:
          { type: array, items: { $ref: "#/components/schemas/ComplianceAffectedGroup" } }
        risks: { type: array, items: { $ref: "#/components/schemas/ComplianceAssessedRisk" } }
        stakeholders: { type: array, items: { $ref: "#/components/schemas/ComplianceStakeholder" } }
        review_due: { type: string }
        author: { type: string }
        contributors: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        submitted_by: { type: [string, "null"] }
        submitted_at: { type: [string, "null"] }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"] }
        review_comment: { type: [string, "null"] }
        supersedes: { type: [integer, "null"] }
        overdue:
          type: boolean
          description: Derived on read. Approved and past `review_due`, or waiting for a reviewer longer than the grace period. Never true for a superseded version.
        overdue_reason:
          type: [string, "null"]
          description: "`review_due_passed`, `review_pending_too_long`, or null"
        superseded: { type: boolean, description: A later version exists }
    ComplianceDocumentSummary:
      type: object
      required:
        [
          document_id,
          blueprint,
          doc_version,
          content_hash,
          generated_at,
          generated_by,
          gap_count,
          seal,
        ]
      properties:
        document_id: { type: string }
        blueprint: { $ref: "#/components/schemas/ComplianceBlueprintRef" }
        doc_version: { type: integer, minimum: 1 }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        generated_at: { type: string, format: date-time }
        generated_by: { type: string }
        gap_count:
          { type: integer, minimum: 0, description: Items the generator could not evidence }
        seal:
          type: object
          required: [alg, key_id]
          properties:
            alg: { enum: [ed25519, hmac-sha256] }
            key_id: { type: string }
    ComplianceSealedDocument:
      type: object
      required: [body, content_hash, meta, markdown, seal]
      properties:
        body:
          type: object
          additionalProperties: true
          description: The technical documentation (sections, gaps, Annex IV coverage); its canonical JSON hashes to `content_hash`
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        meta:
          type: object
          additionalProperties: true
          description: Document id, tenant, blueprint, version, generation time, generator and the hash of `markdown`
        markdown:
          { type: string, description: A deterministic rendering of `body`; its hash is sealed }
        seal:
          type: object
          required: [alg, key_id, sig]
          properties:
            alg: { enum: [ed25519, hmac-sha256] }
            key_id: { type: string }
            sig: { type: string }
    ComplianceGenerateResult:
      type: object
      required: [document, created]
      properties:
        document: { $ref: "#/components/schemas/ComplianceSealedDocument" }
        created: { type: boolean }
    ComplianceDocumentView:
      type: object
      required: [document, verification]
      properties:
        document: { $ref: "#/components/schemas/ComplianceSealedDocument" }
        verification:
          type: object
          required: [ok, failed]
          description: Recomputed on this read
          properties:
            ok: { type: boolean }
            failed:
              { type: array, items: { enum: [content_hash, markdown, seal_key, seal_signature] } }
    GovernanceDataClass:
      enum: [conversation, memory, run_logs, transcripts, eval_data, telemetry, billing, audit]
    GovernanceIdentifier:
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind:
          {
            enum:
              [
                email,
                phone,
                user_ref,
                end_user_id,
                channel_identity,
                subject_key,
                billing_customer,
              ],
          }
        value: { type: string, minLength: 1, maxLength: 512 }
    GovernanceDsarRequest:
      type: object
      required:
        [
          id,
          kind,
          subject_ref,
          status,
          received_at,
          due_at,
          extended,
          verified_at,
          verified_method,
          destination_region,
          result,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [export, erase, restrict] }
        subject_ref:
          { type: string, description: Opaque keyed pseudonym of the subject; never an identifier }
        status: { enum: [received, verified, processing, completed, rejected, cancelled] }
        received_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        extended: { type: boolean }
        verified_at: { type: [string, "null"], format: date-time }
        verified_method: { type: [string, "null"] }
        destination_region: { type: [string, "null"] }
        result: { type: object, additionalProperties: true }
    GovernanceExportBundle:
      type: object
      required: [manifest, records, signature]
      properties:
        manifest: { type: object, additionalProperties: true }
        records:
          type: object
          additionalProperties: true
          description: store -> collection -> records
        signature:
          type: object
          required: [alg, key_id, value]
          properties:
            alg: { const: Ed25519 }
            key_id: { type: string }
            value: { type: string }
    GovernanceEraseOutcome:
      type: object
      required: [status, request, providers]
      properties:
        status: { enum: [completed, held, partial] }
        request: { $ref: "#/components/schemas/GovernanceDsarRequest" }
        providers:
          type: array
          items: { type: object, additionalProperties: true }
    GovernanceHold:
      type: object
      required: [id, kind, scope, case_ref, classes, reason, placed_by, placed_at, released_at]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [legal_hold, restriction] }
        scope: { enum: [tenant, subject, case] }
        case_ref: { type: [string, "null"] }
        classes:
          oneOf:
            - { type: "null" }
            - { type: array, items: { $ref: "#/components/schemas/GovernanceDataClass" } }
        reason: { type: string }
        placed_by: { type: string }
        placed_at: { type: string, format: date-time }
        released_at: { type: [string, "null"], format: date-time }
    GovernanceRetentionClass:
      type: object
      required: [data_class, requested_days, effective_days, clamped, source]
      properties:
        data_class: { $ref: "#/components/schemas/GovernanceDataClass" }
        requested_days: { type: integer }
        effective_days: { type: integer }
        clamped: { enum: [min, max, null] }
        source: { enum: [control_plane, governance, default] }
    GovernanceRetentionReport:
      type: object
      required: [run_id, dry_run, started_at, classes]
      properties:
        run_id: { type: string, format: uuid }
        dry_run: { type: boolean }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        classes:
          type: array
          items:
            type: object
            required:
              [
                data_class,
                status,
                requested_days,
                effective_days,
                matched,
                purged,
                protected_by_hold,
              ]
            properties:
              data_class: { $ref: "#/components/schemas/GovernanceDataClass" }
              status:
                enum:
                  [
                    purged,
                    dry_run,
                    skipped_hold,
                    retained_by_policy,
                    no_store,
                    error,
                    settings_unavailable,
                  ]
              requested_days: { type: integer }
              effective_days: { type: integer }
              clamped: { enum: [min, max, null] }
              cutoff: { type: [string, "null"], format: date-time }
              matched: { type: integer }
              purged: { type: integer }
              protected_by_hold: { type: integer }
              hold_id: { type: string }
              error: { type: string }
    GovernanceResidency:
      type: object
      required: [home_region, allowed_regions]
      properties:
        home_region: { type: string }
        allowed_regions: { type: array, items: { type: string } }

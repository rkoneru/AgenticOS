openapi: 3.1.0
info:
  title: AXIS Control Plane API
  version: 1.2.0
  summary: Governed agent runtime — REST API v1
  description: |
    Source of truth for the public `/v1` API. SDKs and server route schemas are generated from this file.

    **Conventions**
    - Every request is scoped to one tenant, derived from the credential; there is no `tenant_id` parameter.
    - `POST` endpoints that create or start something accept an `Idempotency-Key` header.
    - Lists are cursor-paginated (`limit`, `cursor`) and return `next_cursor`.
    - Errors use `application/problem+json` (RFC 9457).
    - A request that cannot be evaluated by the policy gate is denied, never allowed (`403`, code `policy_denied`).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.{region}.axis.example/v1
    variables:
      region: { default: us-east-1, description: Region-pinned deployment }
security:
  - bearerAuth: []
  - apiKey: []
tags:
  - { name: Blueprints, description: Versioned ABL agent blueprints }
  - { name: Runs, description: Agent runs and their process lifecycle }
  - { name: Approvals, description: Human-in-the-loop approval queue }
  - { name: Policies, description: Policy packs compiled to Rego }
  - { name: Audit, description: Tamper-evident audit log }
  - { name: Kill switches, description: Emergency stops by scope }
  - { name: Usage, description: Metered usage }
  - { name: Evals, description: Eval Hub runs }
  - { name: Explanations, description: Read-only AGIL explanations of runs and audited decisions }
  - { name: Identity, description: Who the credential belongs to }
  - {
      name: Registry,
      description: "Signed, provenance-attested blueprint registry (private namespaces per tenant)",
    }
  - { name: Marketplace, description: Security-reviewed listings and consented installs }
paths:
  /blueprints:
    get:
      tags: [Blueprints]
      operationId: listBlueprints
      summary: List blueprints
      parameters:
        [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Page of blueprints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Blueprints]
      operationId: publishBlueprintVersion
      summary: Validate and publish a blueprint version (immutable once published)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abl]
              additionalProperties: false
              properties:
                abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintVersion" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /blueprints/{name}/versions/{version}:
    get:
      tags: [Blueprints]
      operationId: getBlueprintVersion
      summary: Get one blueprint version
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Blueprint version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlueprintVersion" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/ProcessState" } }
        - { name: blueprint, in: query, schema: { type: string } }
      responses:
        "200":
          description: Page of runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Runs]
      operationId: startRun
      summary: Start a run (spawns the init process as a durable workflow)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              additionalProperties: false
              properties:
                blueprint:
                  type: object
                  required: [name, version]
                  properties:
                    name: { type: string }
                    version: { type: string }
                input: { type: object }
      responses:
        "202":
          description: Accepted; the run is starting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get a run
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{runId}/signals:
    post:
      tags: [Runs]
      operationId: signalRun
      summary: Send a signal (PAUSE, RESUME, TERM, KILL, INTERRUPT) to a process in the run
      parameters:
        [
          { $ref: "#/components/parameters/RunId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              additionalProperties: false
              properties:
                pid:
                  {
                    $ref: "#/components/schemas/Pid",
                    description: Defaults to the run's init process,
                  }
                signal: { $ref: "#/components/schemas/Signal" }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Signal delivered; resulting state
          content:
            application/json:
              schema:
                type: object
                required: [pid, state]
                properties:
                  pid: { $ref: "#/components/schemas/Pid" }
                  state: { $ref: "#/components/schemas/ProcessState" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{runId}/events:
    get:
      tags: [Runs]
      operationId: listRunEvents
      summary: Read the run's append-only event log (basis for replay)
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: after_sequence, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Events in sequence order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }
                  next_cursor: { type: [string, "null"] }
            text/event-stream:
              schema:
                {
                  type: string,
                  description: Server-sent RunEvent objects when Accept is text/event-stream,
                }
        default: { $ref: "#/components/responses/Problem" }
  /approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List approvals
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApprovalStatus" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Page of approvals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalPage" }
        default: { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: Approve or reject a pending approval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { enum: [approve, reject] }
                comment: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /policies:
    get:
      tags: [Policies]
      operationId: listPolicyPacks
      summary: List policy packs
      parameters:
        [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Page of policy packs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPackPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Policies]
      operationId: publishPolicyPack
      summary: Validate, compile to Rego and publish a policy pack version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              additionalProperties: false
              properties:
                policy: { $ref: "../schemas/policy-v1.schema.json" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPack" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /policies:test:
    post:
      tags: [Policies]
      operationId: testPolicy
      summary: Evaluate a hypothetical request against a policy pack without executing anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy, request]
              additionalProperties: false
              properties:
                policy: { $ref: "../schemas/policy-v1.schema.json" }
                request:
                  type: object
                  required: [enforcement_point, context]
                  properties:
                    enforcement_point: { type: string }
                    action: { type: string }
                    context: { type: object }
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateDecision" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Query the tenant's audit log
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: trace_id, in: query, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
        - { name: decision, in: query, schema: { $ref: "#/components/schemas/Decision" } }
        - { name: from_seq, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Page of audit events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "../schemas/audit-event-v1.schema.json" } }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }
  /runs/{runId}/explanation:
    get:
      tags: [Explanations]
      operationId: explainRun
      summary: Explain a run from its audit trail (AGIL; read-only, deterministic)
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Structured explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explanation" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/events/{seq}/explanation:
    get:
      tags: [Explanations]
      operationId: explainAuditEvent
      summary: Explain one audited decision or approval step (AGIL; read-only, deterministic)
      parameters:
        - { name: seq, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Structured explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explanation" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /audit/verify:
    post:
      tags: [Audit]
      operationId: verifyAuditChain
      summary: Verify hash-chain integrity over a range
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from_seq: { type: integer, minimum: 1 }
                to_seq: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Verdict
          content:
            application/json:
              schema:
                type: object
                required: [ok, verified]
                properties:
                  ok: { type: boolean }
                  verified: { type: integer }
                  broken_at_seq: { type: integer }
                  reason: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /kill-switches:
    get:
      tags: [Kill switches]
      operationId: listKillSwitches
      summary: List engaged kill-switches visible to the tenant
      responses:
        "200":
          description: Kill switches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/KillSwitch" } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [Kill switches]
      operationId: setKillSwitch
      summary: Engage or release a tenant, agent or tool kill-switch (effective < 1 s)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillSwitchRequest" }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KillSwitch" }
        default: { $ref: "#/components/responses/Problem" }
  /usage:
    get:
      tags: [Usage]
      operationId: getUsage
      summary: Metered usage by meter and period
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: group_by, in: query, schema: { enum: [meter, model, blueprint, day] } }
      responses:
        "200":
          description: Usage rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [meter, quantity, unit]
                      properties:
                        meter: { $ref: "#/components/schemas/Meter" }
                        quantity: { type: number }
                        unit: { type: string }
                        group: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /evals/runs:
    post:
      tags: [Evals]
      operationId: startEvalRun
      summary: Run an eval suite against a blueprint version
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suite, blueprint]
              additionalProperties: false
              properties:
                suite: { type: string }
                blueprint:
                  type: object
                  required: [name, version]
                  properties:
                    name: { type: string }
                    version: { type: string }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalRun" }
        default: { $ref: "#/components/responses/Problem" }
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Who the credential belongs to (tenant, member, role, credential kind and scopes)
      description: Needs a valid credential only; no scope is required, so a narrowly scoped API key can still identify itself.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        default: { $ref: "#/components/responses/Problem" }
  /approvals/{approvalId}:
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Get one approval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /policies/{versionId}/activate:
    post:
      tags: [Policies]
      operationId: activatePolicyPack
      summary: Make a published policy pack version the tenant's active version of that pack (the Risk Kernel enforces it from then on)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPack" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/namespaces:
    get:
      tags: [Registry]
      operationId: listRegistryNamespaces
      summary: List the registry namespaces your tenant owns
      responses:
        "200":
          description: Namespaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistryNamespace" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Registry]
      operationId: claimRegistryNamespace
      summary: Claim a registry namespace for your tenant (admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace]
              additionalProperties: false
              properties:
                namespace: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
      responses:
        "201":
          description: Claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryNamespace" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/namespaces/{namespace}/keys:
    get:
      tags: [Registry]
      operationId: listRegistryKeys
      summary: List a namespace's publisher keys (public halves only)
      parameters: [{ $ref: "#/components/parameters/Namespace" }]
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistryKey" } }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Registry]
      operationId: addRegistryKey
      summary: Register an Ed25519 publisher public key for a namespace (admin)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              additionalProperties: false
              properties:
                public_key:
                  { type: string, description: base64url of the raw 32-byte Ed25519 public key }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryKey" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/namespaces/{namespace}/blueprints:
    post:
      tags: [Registry]
      operationId: publishRegistryBlueprint
      summary: Publish a signed blueprint version with its provenance attestation (immutable; verified before it is stored)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abl, signature, provenance]
              additionalProperties: false
              properties:
                abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
                signature: { $ref: "#/components/schemas/RegistrySignature" }
                provenance: { $ref: "#/components/schemas/DsseEnvelope" }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryVersion" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/blueprints/{namespace}/{name}/versions:
    get:
      tags: [Registry]
      operationId: listRegistryVersions
      summary: List the versions of a registry blueprint with their status
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistryVersion" } }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/blueprints/{namespace}/{name}/versions/{version}/yank:
    post:
      tags: [Registry]
      operationId: yankRegistryVersion
      summary: Yank a version so it stops resolving (admin; recorded, never deleted)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Yanked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /registry/resolve:
    get:
      tags: [Registry]
      operationId: resolveRegistryBlueprint
      summary: Resolve `namespace/name@range` to the highest non-yanked version and VERIFY it (hash, signature, provenance) before returning it
      parameters:
        - { name: ref, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: The verified blueprint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedBlueprint" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/listings:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceListings
      summary: Browse the marketplace catalog (listed, security-reviewed blueprints only)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, maxLength: 50 } }
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MarketplaceListing" } }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/listings/{namespace}/{name}:
    get:
      tags: [Marketplace]
      operationId: getMarketplaceListing
      summary: Get one marketplace listing
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceListing" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/installs/preview:
    post:
      tags: [Marketplace]
      operationId: previewMarketplaceInstall
      summary: Preview an install - findings, requested permissions, the diff against your tenant baseline and the consent digest (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, name, range]
              additionalProperties: false
              properties:
                namespace: { type: string }
                name: { type: string }
                range: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallPreview" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/installs:
    get:
      tags: [Marketplace]
      operationId: listMarketplaceInstalls
      summary: List your tenant's installs
      responses:
        "200":
          description: Installs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MarketplaceInstall" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [Marketplace]
      operationId: installMarketplaceListing
      summary: Install a listing, pinned to a version and content hash, with consent to the exact permission diff you previewed (admin)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, name, version, content_hash, consent_digest]
              additionalProperties: false
              properties:
                namespace: { type: string }
                name: { type: string }
                version: { type: string }
                content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                consent_digest: { type: string }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceInstall" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/Problem" }
  /marketplace/installs/{namespace}/{name}/uninstall:
    post:
      tags: [Marketplace]
      operationId: uninstallMarketplaceListing
      summary: Uninstall a listing (admin)
      parameters:
        - { $ref: "#/components/parameters/Namespace" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Uninstalled
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      {
        type: http,
        scheme: bearer,
        bearerFormat: JWT,
        description: Short-lived token issued via WorkOS SSO,
      }
    apiKey: { type: apiKey, in: header, name: X-Axis-Api-Key }
  parameters:
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    Namespace:
      {
        name: namespace,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" },
      }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key; replays within 24 h return the original response.
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationProblem:
      description: The document failed schema or lint validation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblemBody" }
  schemas:
    Pid: { type: string, pattern: "^axp_[0-9A-HJKMNP-TV-Z]{26}$" }
    ProcessState: { enum: [spawn, ready, running, waiting, suspended, terminated] }
    Signal: { enum: [PAUSE, RESUME, TERM, KILL, INTERRUPT] }
    Decision: { enum: [ALLOW, DENY, REQUIRE_APPROVAL, ALLOW_WITH_REDACTION] }
    ApprovalStatus: { enum: [pending, approved, rejected, expired, escalated] }
    Meter:
      {
        enum:
          [
            tokens,
            runtime_seconds,
            tool_executions,
            voice_minutes,
            storage_gb_hours,
            marketplace_installs,
          ],
      }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: "URI, e.g. https://axis.example/problems/policy_denied" }
        title: { type: string }
        status: { type: integer }
        code:
          {
            enum:
              [
                unauthenticated,
                forbidden,
                policy_denied,
                not_found,
                conflict,
                validation_failed,
                rate_limited,
                budget_exceeded,
                internal,
              ],
          }
        detail: { type: string }
        trace_id: { type: string }
    ValidationProblemBody:
      allOf:
        - { $ref: "#/components/schemas/Problem" }
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  { path: { type: string }, keyword: { type: string }, message: { type: string } }
    BlueprintVersion:
      type: object
      required: [name, version, risk_level, created_at, abl]
      properties:
        name: { type: string }
        version: { type: string }
        risk_level: { enum: [minimal, limited, high] }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        signature: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
    BlueprintPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BlueprintVersion" } }
        next_cursor: { type: [string, "null"] }
    Run:
      type: object
      required: [id, blueprint, state, created_at]
      properties:
        id: { type: string, format: uuid }
        init_pid: { $ref: "#/components/schemas/Pid" }
        blueprint:
          type: object
          required: [name, version]
          properties: { name: { type: string }, version: { type: string } }
        state: { $ref: "#/components/schemas/ProcessState" }
        exit_reason: { type: [string, "null"] }
        trace_id: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    RunPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
        next_cursor: { type: [string, "null"] }
    RunEvent:
      type: object
      required: [sequence, type, pid, at]
      properties:
        sequence: { type: integer, minimum: 1 }
        type:
          {
            type: string,
            description: "state_transition, model_call, tool_call, gate_decision, message, ...",
          }
        pid: { $ref: "#/components/schemas/Pid" }
        at: { type: string, format: date-time }
        audit_event_id: { type: string, format: uuid }
        data: { type: object }
    GateDecision:
      type: object
      required: [decision, policy_version]
      properties:
        decision: { $ref: "#/components/schemas/Decision" }
        policy_version: { type: string }
        reason: { type: string }
        matched_rule_ids: { type: array, items: { type: string } }
        redact_fields: { type: array, items: { type: string } }
    Approval:
      type: object
      required: [id, status, run_id, requested_at, sla_deadline]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        run_id: { type: string, format: uuid }
        pid: { $ref: "#/components/schemas/Pid" }
        action: { type: string }
        roles: { type: array, items: { type: string } }
        requested_at: { type: string, format: date-time }
        sla_deadline: { type: string, format: date-time }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        comment: { type: [string, "null"] }
    ApprovalPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        next_cursor: { type: [string, "null"] }
    PolicyPack:
      type: object
      required: [name, version, created_at]
      properties:
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        created_at: { type: string, format: date-time }
        version_id: { type: string, format: uuid, description: Id to pass to activatePolicyPack }
        active:
          {
            type: boolean,
            description: Whether this version is the tenant's active version of the pack,
          }
    PolicyPackPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PolicyPack" } }
        next_cursor: { type: [string, "null"] }
    KillSwitchRequest:
      type: object
      required: [scope, engaged]
      additionalProperties: false
      properties:
        scope: { enum: [tenant, agent, tool] }
        target: { type: string, description: Required for agent and tool scopes }
        engaged: { type: boolean }
        reason: { type: string, maxLength: 500 }
    KillSwitch:
      type: object
      required: [scope, engaged, updated_at]
      properties:
        scope: { enum: [global, tenant, agent, tool] }
        target: { type: [string, "null"] }
        engaged: { type: boolean }
        reason: { type: [string, "null"] }
        updated_at: { type: string, format: date-time }
    EvalRun:
      type: object
      required: [id, suite, status]
      properties:
        id: { type: string, format: uuid }
        suite: { type: string }
        status: { enum: [queued, running, passed, failed, errored] }
        score: { type: [number, "null"] }
        threshold: { type: [number, "null"] }
    Explanation:
      type: object
      required: [summary, steps, decision_refs, remediation]
      properties:
        summary: { type: string, description: Plain-language summary derived from the audit rows }
        steps:
          type: array
          items:
            type: object
            required: [n, kind, text]
            properties:
              n: { type: integer, minimum: 1 }
              kind: { enum: [request, evaluation, outcome, context, run] }
              text: { type: string }
              audit_event_id: { type: string, format: uuid }
              seq: { type: integer, minimum: 1 }
        decision_refs:
          type: array
          description: The audited decisions the explanation rests on
          items:
            type: object
            required:
              [
                audit_event_id,
                seq,
                decision,
                enforcement_point,
                action,
                policy_version,
                gate,
                rule_ids,
                reason,
              ]
            properties:
              audit_event_id: { type: string, format: uuid }
              seq: { type: integer, minimum: 1 }
              ts: { type: string, format: date-time }
              decision: { $ref: "#/components/schemas/Decision" }
              enforcement_point: { type: string }
              action: { type: string }
              policy_version: { type: string }
              policy_packs: { type: array, items: { type: string } }
              gate:
                enum:
                  [
                    kill_switch,
                    policy_rule,
                    default_deny,
                    amount_cap,
                    target_cap,
                    budget,
                    rate_limit,
                    staleness,
                    approval,
                    audit_unavailable,
                    invalid_request,
                    evaluation_failure,
                    admin,
                    other,
                  ]
              rule_ids: { type: array, items: { type: string } }
              gate_id: { type: string }
              kill_switch_scope: { enum: [global, tenant, agent, tool] }
              approval_id: { type: string, format: uuid }
              reason: { type: string }
        remediation:
          type: array
          description: What would allow the action; derived from the audit reason and the tenant's own policy metadata
          items:
            type: object
            required: [kind, text]
            properties:
              kind:
                enum:
                  [
                    release_kill_switch,
                    add_policy_rule,
                    review_policy_rule,
                    adjust_request,
                    raise_limit,
                    wait,
                    decide_approval,
                    retry,
                    contact_operator,
                    inspect,
                  ]
              text: { type: string }
              hint: { type: string }
        narrative:
          type: string
          description: Optional model-written prose; present only when the operator enabled the narrator
    Identity:
      type: object
      required: [tenant, member, credential]
      properties:
        tenant:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            region: { type: string }
        member:
          type: object
          required: [id, role]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
            role: { enum: [owner, admin, builder, operator, auditor, billing, viewer] }
        credential:
          type: object
          required: [kind]
          properties:
            kind: { enum: [session, api_key] }
            scopes: { type: array, items: { type: string } }
    RegistryNamespace:
      type: object
      required: [namespace]
      properties:
        namespace: { type: string }
        public: { type: boolean }
        created_at: { type: string, format: date-time }
    RegistryKey:
      type: object
      required: [key_id, public_key, valid_from]
      properties:
        key_id: { type: string }
        public_key: { type: string }
        valid_from: { type: string, format: date-time }
        valid_until: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revoke_reason: { type: [string, "null"] }
    RegistrySignature:
      type: object
      required: [key_id, signed_at, sig]
      additionalProperties: false
      properties:
        key_id: { type: string }
        signed_at: { type: string, format: date-time }
        sig:
          {
            type: string,
            description: base64url Ed25519 signature over the canonical signed message,
          }
    DsseEnvelope:
      type: object
      required: [payloadType, payload, signatures]
      properties:
        payloadType: { type: string }
        payload: { type: string, description: base64 of the canonical in-toto statement }
        signatures:
          type: array
          items:
            type: object
            required: [keyid, sig]
            properties:
              keyid: { type: string }
              sig: { type: string }
    RegistryVersion:
      type: object
      required: [namespace, name, version, content_hash, risk_level, signature, published_at]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { enum: [minimal, limited, high] }
        signature: { $ref: "#/components/schemas/RegistrySignature" }
        published_at: { type: string, format: date-time }
        published_by: { type: string }
        state: { enum: [active, deprecated, yanked] }
        state_reason: { type: [string, "null"] }
    ResolvedBlueprint:
      type: object
      description: A registry version after verification, with its ABL document, provenance and what was verified
      required:
        [
          namespace,
          name,
          version,
          content_hash,
          risk_level,
          signature,
          published_at,
          abl,
          provenance,
          verification,
        ]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { enum: [minimal, limited, high] }
        signature: { $ref: "#/components/schemas/RegistrySignature" }
        published_at: { type: string, format: date-time }
        published_by: { type: string }
        state: { enum: [active, deprecated, yanked] }
        state_reason: { type: [string, "null"] }
        abl: { $ref: "../../abl/schema/abl-v1.schema.json" }
        provenance: { $ref: "#/components/schemas/DsseEnvelope" }
        verification:
          type: object
          description: What the registry re-verified before answering (signing key, builder, source, compiler)
          required: [key_id]
          properties:
            key_id: { type: string }
            builder: { type: string }
            source_ref: { type: string }
            compiler_version: { type: string }
    MarketplaceListing:
      type: object
      required: [namespace, name, title, summary, categories, versions]
      properties:
        namespace: { type: string }
        name: { type: string }
        title: { type: string }
        summary: { type: string }
        categories: { type: array, items: { type: string } }
        publisher: { type: string }
        latest:
          type: [object, "null"]
          properties:
            version: { type: string }
            content_hash: { type: string }
            risk_level: { type: string }
            max_severity: { type: string }
        versions:
          { type: array, items: { type: string }, description: "Approved, installable versions" }
    Capability:
      type: object
      required: [key, level]
      properties:
        key: { type: string }
        level: { type: number }
    InstallPreview:
      type: object
      required:
        [
          namespace,
          name,
          version,
          content_hash,
          risk_level,
          findings,
          capabilities,
          diff,
          consent_digest,
        ]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        risk_level: { type: string }
        max_severity: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [id, severity, message]
            properties:
              id: { type: string }
              severity: { type: string }
              path: { type: string }
              message: { type: string }
        capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" } }
        diff:
          type: object
          description: Requested permissions versus what your tenant has granted; `widening` means consent is required
          required: [added, removed, widening]
          properties:
            added:
              type: array
              items:
                type: object
                required: [key, change, level]
                properties:
                  key: { type: string }
                  change: { enum: [new, raised] }
                  level: { type: number }
                  previous_level: { type: [number, "null"] }
            removed:
              type: array
              items:
                type: object
                required: [key, level]
                properties:
                  key: { type: string }
                  level: { type: number }
                  new_level: { type: [number, "null"] }
            widening: { type: boolean }
        consent_digest:
          {
            type: string,
            description: Echo it on install to prove you saw this exact diff of this exact blueprint,
          }
    MarketplaceInstall:
      type: object
      required: [id, namespace, name, version, content_hash, state, granted]
      properties:
        id: { type: string }
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        state: { enum: [active, flagged, uninstalled] }
        granted: { type: array, items: { $ref: "#/components/schemas/Capability" } }
        consented_by: { type: string }
        consented_at: { type: string, format: date-time }
        flag_reason: { type: [string, "null"] }

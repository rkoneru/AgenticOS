apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docs-site.fullname" . }}
  labels:
    {{- include "docs-site.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "docs-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docs-site.selectorLabels" . | nindent 8 }}
      # No checksum/config annotation (NEEDS #518): this chart renders no ConfigMap/Secret at
      # all — the static site is baked into the image at build time (apps/docs-site/Dockerfile),
      # so an image tag bump is the only "config" change a rollout ever needs to pick up, and
      # Kubernetes already rolls pods on an image change with no extra annotation required.
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "docs-site.serviceAccountName" . }}
      # Kubernetes injects <SVC>_PORT=tcp://<ip>:<port> Docker-links-style env vars for
      # every Service already in this namespace, uppercased with '-' -> '_'. Several AXIS
      # services read their OWN port from an env var of exactly that shape (e.g.
      # AXIS_BILLING_PORT for a Service named axis-billing), so the injected value silently
      # clobbers the app's real port with "tcp://10.x.x.x:8080" -- Number() of that string is
      # NaN, and the app's own listen() call crashes with ERR_SOCKET_BAD_PORT. Found live
      # deploying to a real k3d cluster this pass (NEEDS #525): billing and registry both hit
      # this exact crash (data-governance and docs-site did not, only because their own port
      # env var names happen not to collide with their Service names). Disabled on every
      # chart, not just the two that happened to collide today, since the same class of
      # collision depends only on naming and would otherwise resurface silently elsewhere.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs-site
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

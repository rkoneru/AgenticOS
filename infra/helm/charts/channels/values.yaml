enabled: true
replicaCount: 2
image:
  repository: axis/channels
  tag: dev
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
readOnlyRootFilesystem: true
# Numeric UID/GID (not just a named user): Kubernetes' runAsNonRoot pod securityContext can only
# verify non-root when either the image's USER is numeric or the pod spec pins runAsUser itself
# (same CreateContainerConfigError class found deploying risk-kernel/control-plane/runtime to a
# real k3d cluster, docs/runbooks/local-cluster.md; this Dockerfile's final-stage USER is now
# numeric too, NEEDS #516).
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
serviceAccount:
  create: true
  annotations: {}
  name: ""
probes:
  enabled: true
config:
  AXIS_CHANNELS_ROLE: axis_app
secret:
  create: true
  existingSecret: ""
  data:
    AXIS_CHANNELS_DATABASE_URL: ""
    AXIS_CHANNELS_HASH_KEY: ""
    AXIS_CHANNELS_TOKENS: ""
    AXIS_CHANNELS_ROUTES: ""
networkPolicy:
  enabled: true
  allowIngressFromNamespace: true
  allowEgressToPostgres: true
  postgresSelector:
    app.kubernetes.io/name: postgresql
  postgresPort: 5432
  extraEgress: []
  extraIngress: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

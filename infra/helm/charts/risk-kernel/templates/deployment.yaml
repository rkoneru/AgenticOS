apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "risk-kernel.fullname" . }}
  labels:
    {{- include "risk-kernel.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "risk-kernel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "risk-kernel.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolls pods automatically when only this chart's ConfigMap/Secret *data* changes (a
        # values-file-only change otherwise leaves existing pods on stale config until something
        # else recreates them — found live redeploying to a real k3d cluster, NEEDS #518).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "risk-kernel.serviceAccountName" . }}
      # Kubernetes injects <SVC>_PORT=tcp://<ip>:<port> Docker-links-style env vars for
      # every Service already in this namespace, uppercased with '-' -> '_'. Several AXIS
      # services read their OWN port from an env var of exactly that shape (e.g.
      # AXIS_BILLING_PORT for a Service named axis-billing), so the injected value silently
      # clobbers the app's real port with "tcp://10.x.x.x:8080" -- Number() of that string is
      # NaN, and the app's own listen() call crashes with ERR_SOCKET_BAD_PORT. Found live
      # deploying to a real k3d cluster this pass (NEEDS #525): billing and registry both hit
      # this exact crash (data-governance and docs-site did not, only because their own port
      # env var names happen not to collide with their Service names). Disabled on every
      # chart, not just the two that happened to collide today, since the same class of
      # collision depends only on naming and would otherwise resurface silently elsewhere.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: risk-kernel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.approvalsBridge.enabled }}
            - name: approvals
              containerPort: {{ .Values.approvalsBridge.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.probes.enabled }}
          # Native Kubernetes gRPC probe (1.24+, stable since 1.27): dials the standard
          # grpc.health.v1.Health service's Check RPC (services/risk-kernel/src/grpc.ts's
          # addHealthService, NEEDS #507) instead of a bare tcpSocket accept check, so a pod only
          # becomes/stays Ready once it actually answers a real RPC over the real gate server, not
          # merely once its listener accepts a connection.
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "risk-kernel.fullname" . }}-config
                optional: true
            - secretRef:
                name: {{ include "risk-kernel.secretName" . }}
          env:
            {{- if .Values.approvalsBridge.enabled }}
            - name: AXIS_APPROVALS_DEV_BRIDGE
              value: "1"
            - name: AXIS_APPROVALS_PORT
              value: {{ .Values.approvalsBridge.port | quote }}
            {{- end }}
            - name: AXIS_RK_KILL_STATE_FILE
              value: /var/run/axis/kill-switch.json
            {{- if .Values.policyBundle.secretName }}
            - name: AXIS_POLICY_BUNDLE
              value: /etc/axis/policy/bundle.tar.gz
            {{- else if .Values.policyBundle.dirSecretName }}
            - name: AXIS_POLICY_BUNDLE_DIR
              value: /etc/axis/policy-dir
            {{- end }}
            {{- if .Values.tokens.secretName }}
            - name: AXIS_RK_TOKENS
              value: /etc/axis/tokens/tokens.json
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: run
              mountPath: /var/run/axis
            - name: tmp
              mountPath: /tmp
            {{- if .Values.policyBundle.secretName }}
            - name: policy-bundle
              mountPath: /etc/axis/policy
              readOnly: true
            {{- else if .Values.policyBundle.dirSecretName }}
            - name: policy-bundle-dir
              mountPath: /etc/axis/policy-dir
            {{- end }}
            {{- if .Values.tokens.secretName }}
            - name: tokens
              mountPath: /etc/axis/tokens
              readOnly: true
            {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.policyBundle.secretName }}
        - name: policy-bundle
          secret:
            secretName: {{ .Values.policyBundle.secretName }}
        {{- else if .Values.policyBundle.dirSecretName }}
        - name: policy-bundle-dir
          secret:
            secretName: {{ .Values.policyBundle.dirSecretName }}
        {{- end }}
        {{- if .Values.tokens.secretName }}
        - name: tokens
          secret:
            secretName: {{ .Values.tokens.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.runServer.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtime.fullname" . }}-run-server
  labels:
    {{- include "runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: run-server
spec:
  {{- if not .Values.runServer.autoscaling.enabled }}
  replicas: {{ .Values.runServer.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: run-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: run-server
      annotations:
        # Rolls run-server pods automatically when only run-server-configmap.yaml's rendered
        # data changes (a values-file-only change otherwise leaves existing pods on stale config
        # until something else recreates them — found live redeploying to a real k3d cluster,
        # NEEDS #518). eval-runner-deployment.yaml's config comes from an externally-provided
        # Secret this chart never renders (`evalRunner.configSecretName`), so there is nothing
        # for it to checksum from the chart's own templates; see that file's own comment.
        checksum/config: {{ include (print $.Template.BasePath "/run-server-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "runtime.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: run-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scripts/run_server.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.runServer.service.port }}
              protocol: TCP
          {{- if .Values.runServer.probes.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "runtime.fullname" . }}-run-server-config
                optional: true
          env:
            - name: RUNSERVER_CONFIG
              value: /etc/axis/runtime/runserver-config.json
          resources:
            {{- toYaml .Values.runServer.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.runServer.configSecretName }}
            - name: run-server-config
              mountPath: /etc/axis/runtime
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.runServer.configSecretName }}
        - name: run-server-config
          secret:
            secretName: {{ .Values.runServer.configSecretName }}
            items:
              - key: runserver-config.json
                path: runserver-config.json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}

{{- if .Values.evalRunner.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtime.fullname" . }}-eval-runner
  labels:
    {{- include "runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval-runner
spec:
  replicas: {{ .Values.evalRunner.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: eval-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: eval-runner
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "runtime.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eval-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scripts/eval_runner.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          env:
            - name: EVAL_RUNNER_CONFIG
              value: /etc/axis/runtime/eval-runner-config.json
          resources:
            {{- toYaml .Values.evalRunner.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.evalRunner.configSecretName }}
            - name: eval-runner-config
              mountPath: /etc/axis/runtime
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.evalRunner.configSecretName }}
        - name: eval-runner-config
          secret:
            secretName: {{ .Values.evalRunner.configSecretName }}
            items:
              - key: eval-runner-config.json
                path: eval-runner-config.json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}

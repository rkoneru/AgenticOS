replicaCount: 2
image:
  repository: axis/data-governance
  tag: dev
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
serviceAccount:
  create: true
  annotations: {}
  name: ''
probes:
  enabled: true
config:
  AXIS_GOV_ROLE: axis_app
  AXIS_GOV_REGION: us-east-1
secret:
  create: true
  existingSecret: ''
  data:
    AXIS_GOV_DATABASE_URL: ''
    AXIS_GOV_MASTER_KEY: ''
    AXIS_GOV_TOKENS: ''
networkPolicy:
  enabled: true
  allowIngressFromNamespace: true
  allowEgressToPostgres: true
  postgresSelector:
    app.kubernetes.io/name: postgresql
  postgresPort: 5432
  extraEgress: []
  extraIngress: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

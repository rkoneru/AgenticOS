apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "console.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolls pods automatically when only this chart's ConfigMap/Secret *data* changes (a
        # values-file-only change otherwise leaves existing pods on stale config until something
        # else recreates them — found live redeploying to a real k3d cluster, NEEDS #518).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      # Kubernetes injects <SVC>_PORT=tcp://<ip>:<port> Docker-links-style env vars for
      # every Service already in this namespace, uppercased with '-' -> '_'. Several AXIS
      # services read their OWN port from an env var of exactly that shape (e.g.
      # AXIS_BILLING_PORT for a Service named axis-billing), so the injected value silently
      # clobbers the app's real port with "tcp://10.x.x.x:8080" -- Number() of that string is
      # NaN, and the app's own listen() call crashes with ERR_SOCKET_BAD_PORT. Found live
      # deploying to a real k3d cluster this pass (NEEDS #525): billing and registry both hit
      # this exact crash (data-governance and docs-site did not, only because their own port
      # env var names happen not to collide with their Service names). Disabled on every
      # chart, not just the two that happened to collide today, since the same class of
      # collision depends only on naming and would otherwise resurface silently elsewhere.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "console.fullname" . }}-config
                optional: true
            - secretRef:
                name: {{ include "console.secretName" . }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextcache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextcache
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

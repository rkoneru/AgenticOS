enabled: true
replicaCount: 2
image:
  repository: axis/console
  tag: dev
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3100
readOnlyRootFilesystem: true
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 768Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
serviceAccount:
  create: true
  annotations: {}
  name: ""
probes:
  enabled: true
config:
  AXIS_API_URL: "http://axis-api-gateway:8080"
  AXIS_CONTROL_PLANE_URL: "http://axis-control-plane:8080"
  NEXT_PUBLIC_FEATURE_EVALS: "true"
  NEXT_PUBLIC_FEATURE_MARKETPLACE: "true"
secret:
  create: true
  existingSecret: ""
  data:
    AXIS_GATEWAY_BEARER: ""
    AXIS_SESSION_COOKIE: ""
networkPolicy:
  enabled: true
  allowIngressFromNamespace: true
  # The console calls out to the gateway/control-plane, not a database directly.
  allowEgressToPostgres: false
  postgresSelector:
    app.kubernetes.io/name: postgresql
  postgresPort: 5432
  extraEgress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
      ports:
        - port: 8080
          protocol: TCP
  extraIngress: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

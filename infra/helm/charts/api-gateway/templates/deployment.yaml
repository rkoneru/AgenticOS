apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolls pods automatically when only this chart's ConfigMap/Secret *data* changes (a
        # values-file-only change otherwise leaves existing pods on stale config until something
        # else recreates them — found live redeploying to a real k3d cluster, NEEDS #518).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "api-gateway.serviceAccountName" . }}
      # Kubernetes injects <SVC>_PORT=tcp://<ip>:<port> Docker-links-style env vars for
      # every Service already in this namespace, uppercased with '-' -> '_'. Several AXIS
      # services read their OWN port from an env var of exactly that shape (e.g.
      # AXIS_BILLING_PORT for a Service named axis-billing), so the injected value silently
      # clobbers the app's real port with "tcp://10.x.x.x:8080" -- Number() of that string is
      # NaN, and the app's own listen() call crashes with ERR_SOCKET_BAD_PORT. Found live
      # deploying to a real k3d cluster this pass (NEEDS #525): billing and registry both hit
      # this exact crash (data-governance and docs-site did not, only because their own port
      # env var names happen not to collide with their Service names). Disabled on every
      # chart, not just the two that happened to collide today, since the same class of
      # collision depends only on naming and would otherwise resurface silently elsewhere.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.probes.enabled }}
          livenessProbe:
            exec:
              command: ["node", "/app/healthcheck.js"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["node", "/app/healthcheck.js"]
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "api-gateway.fullname" . }}-config
                optional: true
            - secretRef:
                name: {{ include "api-gateway.secretName" . }}
          env:
            - name: GW_PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.secretFiles.secretName }}
            {{- if .Values.secretFiles.runTokensFile }}
            - name: GW_RUN_TOKENS_FILE
              value: /etc/axis/gateway/{{ .Values.secretFiles.runTokensFile }}
            {{- end }}
            {{- if .Values.secretFiles.approvalsTokensFile }}
            - name: GW_APPROVALS_TOKENS_FILE
              value: /etc/axis/gateway/{{ .Values.secretFiles.approvalsTokensFile }}
            {{- end }}
            {{- if .Values.secretFiles.evalRunnerTokensFile }}
            - name: GW_EVAL_RUNNER_TOKENS_FILE
              value: /etc/axis/gateway/{{ .Values.secretFiles.evalRunnerTokensFile }}
            {{- end }}
            {{- if .Values.secretFiles.complianceNeedsFile }}
            - name: GW_COMPLIANCE_NEEDS_FILE
              value: /etc/axis/gateway/{{ .Values.secretFiles.complianceNeedsFile }}
            {{- end }}
            {{- if .Values.secretFiles.bundleDir }}
            - name: GW_BUNDLE_DIR
              value: /etc/axis/gateway-bundles
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secretFiles.secretName }}
            - name: gateway-files
              mountPath: /etc/axis/gateway
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secretFiles.secretName }}
        - name: gateway-files
          secret:
            secretName: {{ .Values.secretFiles.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

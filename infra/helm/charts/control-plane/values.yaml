enabled: true
replicaCount: 2
image:
  repository: axis/control-plane
  tag: dev
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
readOnlyRootFilesystem: true
# Numeric, matching the image's USER (services/control-plane/Dockerfile): required for
# runAsNonRoot to pass against a non-numeric named USER, otherwise kubelet refuses the
# container with CreateContainerConfigError (found deploying to a real k3d cluster).
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
podDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
serviceAccount:
  create: true
  annotations: {}
  name: ""
probes:
  enabled: true
config:
  CP_REGION: us-east-1
  CP_INSECURE_COOKIES: "false"
  CP_RETURN_ORIGINS: ""
  CP_REDIRECT_URI: ""
secret:
  create: true
  existingSecret: ""
  data:
    CP_PG_URL: ""
    CP_DEV_TOKEN: ""
    CP_PLATFORM_TOKEN: ""
    CP_RUNTIME_TOKENS: ""
networkPolicy:
  enabled: true
  allowIngressFromNamespace: true
  allowEgressToPostgres: true
  postgresSelector:
    app.kubernetes.io/name: postgresql
  postgresPort: 5432
  extraEgress: []
  extraIngress: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

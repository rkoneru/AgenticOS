[project]
name = "axis-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
dev-dependencies = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv.workspace]
members = ["runtime", "sdk/python"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by runtime/scripts/gen_proto.sh; never hand-edited.
extend-exclude = ["runtime/src/axis_runtime/_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["runtime/src/axis_runtime/_gen/"]

[[tool.mypy.overrides]]
module = ["axis_runtime._gen.*"]
ignore_errors = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

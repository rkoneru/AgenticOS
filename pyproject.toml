[project]
name = "axis-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
dev-dependencies = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv.workspace]
members = ["runtime", "sdk/python"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by runtime/scripts/gen_proto.sh and scripts/generate-sdks.mjs; never hand-edited.
extend-exclude = ["runtime/src/axis_runtime/_gen", "sdk/python/src/axis_sdk/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, fake credentials, seeded RNG, poll loops and long fixture lines are fine.
"**/tests/**" = ["S101", "S105", "S106", "S311", "E501", "ASYNC109", "ASYNC110"]
# e2e is a test harness: asserts, subprocesses and SQL built from test-generated constants are intended.
"e2e/**" = ["S101", "S106", "S603", "S607", "S608", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["runtime/src/axis_runtime/_gen/"]

[[tool.mypy.overrides]]
module = ["axis_runtime._gen.*"]
ignore_errors = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

# Used when pytest is run from the repo root over several packages
# (`uv run pytest runtime sdk/python`); per-package runs use each package's own pyproject.
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=axis_runtime --cov=axis_sdk --cov-branch --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/axis_runtime/_gen/*"]

[project]
name = "axis-runtime"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.66",
  "protobuf>=5",
  "httpx>=0.27",
  "temporalio>=1.7",
  "cryptography>=43",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.56,<1.57",
]

[dependency-groups]
dev = ["grpcio-tools>=1.66"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axis_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=axis_runtime --cov-branch --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/axis_runtime/_gen/*"]

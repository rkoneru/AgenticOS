[project]
name = "axis-runtime"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axis_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=axis_runtime --cov-branch --cov-fail-under=85"

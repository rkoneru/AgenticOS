apiVersion: policy.axis.dev/v1
kind: PolicyPack
metadata:
  name: control-plane-authz
  version: 1.0.0
  description: "Control plane RBAC + ABAC. Request contract: docs/spec/control-plane.md section 4."
spec:
  defaultDecision: DENY
  rules:
    # ---- ABAC denials. Priority 1000 beats every ALLOW. DENY rules fire on UNKNOWN data, so a request that omits an attribute is denied.
    - id: deny-cross-tenant
      priority: 1000
      enforcementPoints: [tool_call]
      when: { not: { field: args.same_tenant, op: eq, value: true } }
      decision: DENY
    - id: deny-role-ceiling
      priority: 1000
      enforcementPoints: [tool_call]
      when: { not: { field: args.within_ceiling, op: eq, value: true } }
      decision: DENY
    - id: deny-unknown-role
      priority: 1000
      enforcementPoints: [tool_call]
      when:
        not:
          field: actor.role
          op: in
          value: [owner, admin, builder, operator, auditor, billing, viewer, privacy_officer]
      decision: DENY
    - id: deny-session-only-actions-for-api-keys
      priority: 1000
      enforcementPoints: [tool_call]
      when:
        all:
          - { not: { field: actor.credential, op: eq, value: session } }
          - field: tool.name
            op: in
            value:
              [
                members.invite,
                members.update_role,
                members.remove,
                apikeys.create,
                apikeys.rotate,
                apikeys.revoke,
                directories.manage,
                sso.manage,
                domains.manage,
                sessions.revoke,
                modelkeys.write,
                modelkeys.delete,
              ]
      decision: DENY
    - id: deny-restricted-data
      priority: 1000
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: data.classification, op: eq, value: restricted }
          - { not: { field: actor.role, op: in, value: [owner, admin, auditor] } }
      decision: DENY
    - id: deny-prod-writes-for-builders
      priority: 1000
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: args.environment, op: eq, value: prod }
          - { field: actor.role, op: in, value: [builder, operator] }
          - { not: { field: tool.side_effects, op: eq, value: read } }
      decision: DENY
    - id: deny-others-keys-for-builders
      priority: 1000
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: in, value: [builder, operator] }
          - field: tool.name
            op: in
            value: [apikeys.rotate, apikeys.revoke, modelkeys.write, modelkeys.delete]
          - { not: { field: args.owner_is_actor, op: eq, value: true } }
      decision: DENY

    # ---- RBAC grants (role -> actions).
    - id: owner-all
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: owner }
          - field: tool.name
            op: in
            value:
              [
                tenant.read,
                tenant.close,
                members.read,
                members.invite,
                members.update_role,
                members.remove,
                apikeys.read,
                apikeys.create,
                apikeys.rotate,
                apikeys.revoke,
                modelkeys.read,
                modelkeys.write,
                modelkeys.delete,
                policies.read,
                policies.publish,
                policies.activate,
                budgets.read,
                budgets.write,
                settings.read,
                settings.write,
                audit.read,
                billing.read,
                billing.write,
                directories.read,
                directories.manage,
                sso.manage,
                domains.manage,
                sessions.revoke,
              ]
      decision: ALLOW
    # sso.manage is the owner's alone (ADR 0023): whoever controls the tenant's IdP link can sign in as any member it names, owner included.
    - id: admin-most
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: admin }
          - field: tool.name
            op: in
            value:
              [
                tenant.read,
                members.read,
                members.invite,
                members.update_role,
                members.remove,
                apikeys.read,
                apikeys.create,
                apikeys.rotate,
                apikeys.revoke,
                modelkeys.read,
                modelkeys.write,
                modelkeys.delete,
                policies.read,
                policies.publish,
                policies.activate,
                budgets.read,
                budgets.write,
                settings.read,
                settings.write,
                audit.read,
                billing.read,
                directories.read,
                directories.manage,
                domains.manage,
                sessions.revoke,
              ]
      decision: ALLOW
    - id: builder-build
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: builder }
          - field: tool.name
            op: in
            value:
              [
                tenant.read,
                members.read,
                apikeys.read,
                apikeys.create,
                apikeys.rotate,
                apikeys.revoke,
                modelkeys.read,
                modelkeys.write,
                modelkeys.delete,
                policies.read,
                policies.publish,
                budgets.read,
                settings.read,
              ]
      decision: ALLOW
    - id: operator-operate
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: operator }
          - field: tool.name
            op: in
            value:
              [
                tenant.read,
                members.read,
                apikeys.read,
                policies.read,
                budgets.read,
                budgets.write,
                settings.read,
              ]
      decision: ALLOW
    - id: auditor-read
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: auditor }
          - field: tool.name
            op: in
            value:
              [
                tenant.read,
                members.read,
                apikeys.read,
                modelkeys.read,
                policies.read,
                budgets.read,
                settings.read,
                audit.read,
                directories.read,
              ]
      decision: ALLOW
    - id: billing-billing
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: billing }
          - field: tool.name
            op: in
            value: [tenant.read, billing.read, billing.write, budgets.read, budgets.write]
      decision: ALLOW
    - id: viewer-read
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: viewer }
          - { field: tool.name, op: in, value: [tenant.read, policies.read, budgets.read] }
      decision: ALLOW

    # ---- Public API (`api` namespace, ADR 0024): the same roles, decided here for the API gateway. API keys may use these (scope
    # `<resource>:read|write` is enforced by the Authorizer before this pack is asked); none of them is session-only.
    - id: api-owner-admin
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: in, value: [owner, admin] }
          - field: tool.name
            op: in
            value:
              [
                api.blueprints.read,
                api.blueprints.publish,
                api.runs.read,
                api.runs.start,
                api.runs.signal,
                api.events.read,
                api.approvals.read,
                api.approvals.decide,
                api.policies.read,
                api.policies.publish,
                api.policies.test,
                api.audit.read,
                api.audit.verify,
                api.killswitch.read,
                api.killswitch.write,
                api.usage.read,
                api.evals.run,
                api.explanations.read,
                api.policies.activate,
                api.registry.read,
                api.registry.write,
                api.marketplace.read,
                api.marketplace.install,
                api.evals.read,
                api.evals.write,
                api.evals.admin,
                api.evals.review,
                api.compliance.read,
                api.compliance.write,
                api.compliance.review,
                api.governance.read,
              ]
      decision: ALLOW
    - id: api-builder
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: builder }
          - field: tool.name
            op: in
            value:
              [
                api.blueprints.read,
                api.blueprints.publish,
                api.runs.read,
                api.runs.start,
                api.runs.signal,
                api.events.read,
                api.policies.read,
                api.policies.publish,
                api.policies.test,
                api.usage.read,
                api.evals.run,
                api.explanations.read,
                api.registry.read,
                api.registry.write,
                api.marketplace.read,
                api.evals.read,
                api.evals.write,
                api.evals.review,
                api.compliance.read,
                api.compliance.write,
              ]
      decision: ALLOW
    - id: api-operator
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: operator }
          - field: tool.name
            op: in
            value:
              [
                api.blueprints.read,
                api.runs.read,
                api.runs.start,
                api.runs.signal,
                api.events.read,
                api.approvals.read,
                api.approvals.decide,
                api.policies.read,
                api.killswitch.read,
                api.killswitch.write,
                api.usage.read,
                api.explanations.read,
                api.registry.read,
                api.marketplace.read,
                api.evals.read,
                api.evals.review,
                api.compliance.read,
              ]
      decision: ALLOW
    - id: api-auditor
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: auditor }
          - field: tool.name
            op: in
            value:
              [
                api.blueprints.read,
                api.runs.read,
                api.events.read,
                api.approvals.read,
                api.policies.read,
                api.audit.read,
                api.audit.verify,
                api.killswitch.read,
                api.usage.read,
                api.explanations.read,
                api.registry.read,
                api.marketplace.read,
                api.evals.read,
                api.compliance.read,
                api.compliance.review,
                api.governance.read,
              ]
      decision: ALLOW
    - id: api-privacy-officer
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: privacy_officer }
          - field: tool.name
            op: in
            value:
              [api.governance.read, api.governance.write, api.governance.erase, api.compliance.read]
      decision: ALLOW
    - id: privacy-officer-read
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: privacy_officer }
          - { field: tool.name, op: in, value: [tenant.read, settings.read] }
      decision: ALLOW
    - id: api-billing
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: billing }
          - { field: tool.name, op: in, value: [api.usage.read] }
      decision: ALLOW
    - id: api-viewer
      enforcementPoints: [tool_call]
      when:
        all:
          - { field: actor.role, op: eq, value: viewer }
          - field: tool.name
            op: in
            value:
              [
                api.blueprints.read,
                api.runs.read,
                api.events.read,
                api.policies.read,
                api.explanations.read,
                api.registry.read,
                api.marketplace.read,
                api.evals.read,
                api.compliance.read,
              ]
      decision: ALLOW

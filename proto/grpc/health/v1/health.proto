// The standard gRPC health-checking protocol (grpc.health.v1.Health), verbatim per
// https://github.com/grpc/grpc/blob/master/doc/health-checking.md — not an AXIS contract, so it
// is not subject to CLAUDE.md's "frozen v1, ADR to change" rule for proto/axis/**; this file's
// shape is fixed upstream, never ours to change. Vendored here (rather than resolved from an npm
// package at runtime) so services/risk-kernel/src/grpc.ts can protoLoader.loadSync it the same
// way it already loads axis/runtime/v1/gate.proto, with no new runtime dependency. See NEEDS #507
// and docs/adr/0118-grpc-health-check.md.
syntax = "proto3";

package grpc.health.v1;

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3; // Used only by the Watch method.
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}

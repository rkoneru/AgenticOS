version: v2
modules:
  - path: .
lint:
  use: [STANDARD]
  # grpc/health/v1/health.proto is a verbatim vendored copy of the standard gRPC
  # health-checking protocol (grpc.health.v1.Health) — its message/enum/RPC names are fixed
  # upstream and must match exactly for interop with standard tooling (grpc_health_probe,
  # Kubernetes' native grpc probe type, etc.), so only that one file is exempt from this
  # repo's own naming conventions (NEEDS #507, docs/adr/0118-grpc-health-check.md) — every
  # other proto still gets the full STANDARD ruleset.
  ignore_only:
    ENUM_VALUE_PREFIX:
      - grpc/health/v1/health.proto
    ENUM_ZERO_VALUE_SUFFIX:
      - grpc/health/v1/health.proto
    SERVICE_SUFFIX:
      - grpc/health/v1/health.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - grpc/health/v1/health.proto
    RPC_REQUEST_STANDARD_NAME:
      - grpc/health/v1/health.proto
    RPC_RESPONSE_STANDARD_NAME:
      - grpc/health/v1/health.proto
breaking:
  use: [FILE]
